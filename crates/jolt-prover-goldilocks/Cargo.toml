[package]
name = "jolt-prover-goldilocks"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Handwritten Goldilocks + WHIR Jolt prover/verifier (Phase 2, feature-gated)"

[lints]
workspace = true

[dependencies]
jolt-field.workspace = true
jolt-poly.workspace = true
jolt-sumcheck.workspace = true
jolt-transcript.workspace = true
jolt-r1cs.workspace = true
jolt-lookup-tables.workspace = true
jolt-witness.workspace = true
# WHIR PCS + shared spongefish transcript (path dep; not in workspace.dependencies).
jolt-whir = { path = "../jolt-whir", optional = true }
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true

[features]
default = []
# The whole crate is gated behind `goldilocks` (like `jolt-whir`); the default
# build is empty so the BN254 graph never pulls `whir`.
goldilocks = [
    "dep:jolt-whir",
    "jolt-whir/goldilocks",
    "jolt-field/goldilocks",
    "jolt-witness/goldilocks",
]

[package.metadata.cargo-machete]
# Deps wired ahead of the leaf-subprotocol port (M5+); used as modules land.
ignored = ["jolt-poly", "jolt-sumcheck", "jolt-r1cs", "jolt-lookup-tables", "rayon", "serde", "tracing"]
