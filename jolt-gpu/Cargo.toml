[package]
name = "jolt-gpu"
version = "0.1.0"
edition = "2021"
description = "GPU-accelerated compute for Jolt zkVM via wgpu"
repository = "https://github.com/a16z/jolt"
license-file = "LICENSE"

[features]
default = ["native"]
native = ["wgpu/metal", "wgpu/wgc"]
wasm = ["wgpu/webgpu", "dep:wasm-bindgen-futures"]

[dependencies]
wgpu = { version = "24", default-features = false, features = ["wgsl"] }
naga = { version = "24", features = ["wgsl-in"] }
pollster = "0.4"
bytemuck.workspace = true
tracing.workspace = true
thiserror.workspace = true
ark-bn254 = { workspace = true, features = ["curve"] }
ark-ec.workspace = true
ark-ff.workspace = true
ark-std.workspace = true
rayon.workspace = true
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
ark-std = { workspace = true, features = ["std"] }
