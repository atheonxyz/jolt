<!DOCTYPE html>

            --bg: #f4f6f8;
            --panel: #ffffff;
            --ink: #1d2a3a;
            --muted: #5c6776;
            --pass: #1f8a5a;
            --fail: #c0392b;
            --warn: #b9770e;
            --line: #d8dee8;
            --accent: #1f5ea8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 20% -10%, #dbe9ff 0%, transparent 45%),
                radial-gradient(circle at 90% 10%, #d8f3e7 0%, transparent 40%),
                var(--bg);
            min-height: 100vh;
        }

        main {
            width: min(1080px, 100% - 2rem);
            margin: 1.5rem auto 2rem;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(29, 42, 58, 0.08);
            padding: 1rem;
            margin-bottom: 1rem;
        }

        h1 {
            margin: 0 0 0.4rem;
            font-size: clamp(1.4rem, 2.3vw, 2rem);
            color: #143b66;
        }

        p { margin: 0.25rem 0; color: var(--muted); }

        #status { font-weight: 700; color: var(--accent); }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
            table-layout: fixed;
        }

        th, td {
            border-bottom: 1px solid var(--line);
            text-align: left;
            padding: 0.55rem 0.45rem;
            vertical-align: top;
            word-break: break-word;
        }

        th {
            color: #26435f;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .pass { color: var(--pass); font-weight: 700; }
        .fail { color: var(--fail); font-weight: 700; }
        .warn { color: var(--warn); font-weight: 700; }

        details {
            margin-top: 0.4rem;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0.45rem 0.55rem;
            background: #fbfcfe;
        }

        summary {
            cursor: pointer;
            color: #294966;
            font-weight: 700;
        }

        pre {
            margin: 0.45rem 0 0;
            background: #f7f9fc;
            border: 1px solid #e6ebf3;
            border-radius: 8px;
            padding: 0.65rem;
            overflow-x: auto;
            white-space: pre-wrap;
            font-size: 0.74rem;
            line-height: 1.35;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        }

        @media (max-width: 760px) {
            main { width: calc(100% - 1rem); margin-top: 0.8rem; }
            .card { padding: 0.75rem; }
            th, td { font-size: 0.82rem; padding: 0.45rem 0.35rem; }
            pre { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<main>
    <section class="card">
        <h1>GPU Multi-Pairing Pipeline Test</h1>
        <p>Runs fully in-browser with WebGPU (no WASM).</p>
        <p id="status">Initializing...</p>
    </section>

    <section class="card">
        <table>
            <thead>
            <tr>
                <th>Test</th>

                <th>Result</th>

</main>

<script type="module">
import { initGpuPairing, gpuFlatMultiPairing } from "./gpu-pairing.js";

const NUM_LIMBS = 8;
const G1_WORDS = 16;
const G2_WORDS = 32;
const FP12_WORDS = 96;

const BN254_MODULUS = 21888242871839275222246405745257275088696311157297823662689037894645226208583n;
const MONT_R = (1n << 256n) % BN254_MODULUS;

const G1_GEN_X = new Uint32Array([3314486685, 3546104717, 4123462461, 175696680, 2021213740, 1718526831, 2584207151, 235567041]);
const G1_GEN_Y = new Uint32Array([2334006074, 2797242139, 3951957627, 351393361, 4042427480, 3437053662, 873447006, 471134083]);

const G2_GEN_AFFINE = {
    x: {
        c0: 10857046999023057135944570762232829481370756359578518086990519993285655852781n,
        c1: 11559732032986387107991004021392285783925812861821192530917403151452391805634n,
    },
    y: {
        c0: 8495653923123431417604973247489272438418190587263600148770280649306958101930n,
        c1: 4082367875863433681332203403145435568316851327593401208105741076214120093531n,
    },
};

const SHADER_PATHS = {
    common: "./shaders/bn254_common.wgsl",
    miller: "./shaders/bn254_miller.wgsl",
    reduce: "./shaders/bn254_reduce.wgsl",
    curve: "./shaders/msm_g1_curve.wgsl",
};

// CPU ground truth: Full Miller loop for e(G1_gen, G2_gen)
// = main loop + Frobenius Q1/Q2 (NO conjugation — X_IS_NEGATIVE=false for BN254 a16z)
// Computed from arkworks BN254 v0.5.0 (a16z fork) multi_miller_loop
const EXPECTED_FULL_MILLER = new Uint32Array([
  0x5d6ff960, 0x8130a45a, 0x0601ccd2, 0x28449acd, 0xa4199385, 0x394ea383, 0x24405a48, 0x0ee60137,
  0xd5cb5f79, 0x274ad7cc, 0x8a993381, 0x16ee1134, 0x2348a3eb, 0xecbfb12a, 0xed1e5dae, 0x1f3f7a98,
  0xf1e08449, 0x750b70f0, 0x26a04b68, 0xf4b31e26, 0x6f0feb1c, 0x9a0ab37a, 0x60ad2a27, 0x1ac6c729,
  0xd75ddb65, 0xeaa43a71, 0xbdaea748, 0x09ac16e4, 0x4f1d8053, 0x7bd01191, 0x236c6485, 0x2960bc86,
  0xb2ec92f3, 0x358cd289, 0x3ea74db3, 0x702af1d0, 0x5435c133, 0xf1afc726, 0xc62dac57, 0x21bc6c67,
  0xa0980ce6, 0xbf0652b2, 0x8f49c75d, 0xa1c3e87c, 0xc613ea27, 0xed2a2c24, 0x308a4177, 0x1302c860,
  0xfddbbead, 0xb5bce47e, 0x435575e9, 0x73b6f232, 0xfdeb8722, 0xcccdb786, 0x9a5208bf, 0x090fc437,
  0xe1710c81, 0xcb806dfe, 0x078c22cf, 0x081c88e2, 0xb15bc6d0, 0xbd921d08, 0x4f6bf5b6, 0x1cbfa3c5,
  0x2b149b0d, 0xb52570ce, 0xb0e80782, 0x117bf3b8, 0x00e30290, 0xfbaddc56, 0x76c75c0e, 0x152691c3,
  0x393746f7, 0xa6762fb9, 0xdc183fef, 0x7a0330b3, 0x0166b04f, 0xb0178214, 0xbfd3ff3d, 0x050fe049,
  0x28e6e71e, 0xf3026096, 0xc43d1aee, 0xfce1791d, 0x63e057e6, 0x7aadf594, 0xde0ee5e0, 0x2bf73cbc,
  0x34056129, 0x27365f33, 0xdeacc49a, 0xff6f2bc5, 0xa2fa257c, 0xa5b09370, 0x0ce5a944, 0x075d9dbb
]);

// Expected G2 generator serialization from arkworks (Montgomery form u32 limbs)
const EXPECTED_G2_GEN = new Uint32Array([
  45883430, 2390996433, 1232798066, 3706394933, 2541820639, 4223149639, 2945863739, 425146433,
  2823577920, 2947838845, 1476581572, 1615060314, 1386229638, 166285564, 988445547, 352252035,
  2288773622, 1637743261, 4120812408, 4269789847, 589004286, 4288551522, 2929607174, 687701739,
  3340261102, 1678334806, 847068347, 3696752930, 859115638, 1442395582, 2482857090, 228892902
]);

const statusEl = document.getElementById("status");
const resultsBody = document.getElementById("results-body");

function setStatus(msg, cls = "") {
    statusEl.textContent = msg;
    statusEl.className = cls;
}

function appendResultRow({ testName, numPairs, passed, timing, mismatchDetail }) {
    const row = document.createElement("tr");
    row.innerHTML = `
        <td>${testName}</td>
        <td>${numPairs}</td>
        <td class="${passed ? "pass" : "fail"}">${passed ? "PASS" : "FAIL"}</td>
        <td>${timing}</td>
    `;
    resultsBody.appendChild(row);

    if (!passed && mismatchDetail) {
        const detailRow = document.createElement("tr");
        detailRow.innerHTML = "<td colspan=\"4\"></td>";
        const cell = detailRow.firstElementChild;
        const details = document.createElement("details");
        details.open = true;
        const summary = document.createElement("summary");
        summary.textContent = "Mismatch details";
        const pre = document.createElement("pre");
        pre.textContent = mismatchDetail;
        details.appendChild(summary);
        details.appendChild(pre);
        cell.appendChild(details);
        resultsBody.appendChild(detailRow);
    }
}

function hex32(x) {
    return `0x${(x >>> 0).toString(16).padStart(8, "0")}`;
}

function formatFp12(data, label) {
    const lines = [`${label}:`];
    for (let i = 0; i < 12; i += 1) {
        const limbs = [];
        for (let j = 0; j < 8; j += 1) {
            limbs.push(hex32(data[i * 8 + j]));
        }
        lines.push(`  [${i}] ${limbs.join(", ")}`);
    }
    return lines.join("\n");
}

function fp12Equal(a, b) {
    if (a.length !== 96 || b.length !== 96) return false;
    for (let i = 0; i < 96; i += 1) {
        if (a[i] !== b[i]) return false;
    }
    return true;
}

function fp12NonZero(a) {
    for (let i = 0; i < a.length; i += 1) {
        if (a[i] !== 0) return true;
    }
    return false;
}

function buildFp12Mismatch(expected, actual) {
    const firstDiffs = [];
    for (let i = 0; i < FP12_WORDS; i += 1) {
        if (expected[i] !== actual[i]) {
            firstDiffs.push(`[${i}] exp=${hex32(expected[i])} got=${hex32(actual[i])}`);
            if (firstDiffs.length >= 8) break;
        }
    }
    return [
        "First differing limbs:",
        ...firstDiffs,
        "",
        formatFp12(expected, "Expected"),
        "",
        formatFp12(actual, "Actual"),
    ].join("\n");
}

function createG1Point(x, y) {
    const out = new Uint32Array(G1_WORDS);
    out.set(x, 0);
    out.set(y, 8);
    return out;
}

function repeatPoint(point, wordsPerPoint, count) {
    const out = new Uint32Array(wordsPerPoint * count);
    for (let i = 0; i < count; i += 1) {
        out.set(point, i * wordsPerPoint);
    }
    return out;
}

function toMontgomery(v) {
    const x = ((v % BN254_MODULUS) + BN254_MODULUS) % BN254_MODULUS;
    return (x * MONT_R) % BN254_MODULUS;
}

function bigintToLimbsLE(v) {
    let t = v;
    const out = new Uint32Array(NUM_LIMBS);
    const mask = (1n << 32n) - 1n;
    for (let i = 0; i < NUM_LIMBS; i += 1) {
        out[i] = Number(t & mask) >>> 0;
        t >>= 32n;
    }
    return out;
}

function buildG2GeneratorMontgomery() {
    const xC0 = bigintToLimbsLE(toMontgomery(G2_GEN_AFFINE.x.c0));
    const xC1 = bigintToLimbsLE(toMontgomery(G2_GEN_AFFINE.x.c1));
    const yC0 = bigintToLimbsLE(toMontgomery(G2_GEN_AFFINE.y.c0));
    const yC1 = bigintToLimbsLE(toMontgomery(G2_GEN_AFFINE.y.c1));
    const out = new Uint32Array(G2_WORDS);
    out.set(xC0, 0);
    out.set(xC1, 8);
    out.set(yC0, 16);
    out.set(yC1, 24);
    return out;
}

async function fetchShaders() {
    const entries = await Promise.all(Object.entries(SHADER_PATHS).map(async ([name, path]) => {
        const resp = await fetch(path);
        if (!resp.ok) {
            throw new Error(`Failed to fetch ${path}: HTTP ${resp.status}`);
        }
        return [name, await resp.text()];
    }));
    return Object.fromEntries(entries);
}

function createBuffer(device, size, usage, label) {
    return device.createBuffer({ size: Math.max(size, 4), usage, label });
}

async function readBufferU32(device, srcBuffer, byteLength) {
    const staging = createBuffer(device, byteLength, GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ, "staging");
    const enc = device.createCommandEncoder();
    enc.copyBufferToBuffer(srcBuffer, 0, staging, 0, byteLength);
    device.queue.submit([enc.finish()]);
    await staging.mapAsync(GPUMapMode.READ);
    const out = new Uint32Array(staging.getMappedRange().slice(0));
    staging.unmap();
    staging.destroy();
    return out;
}

function assertShaderCompiles(device, code, label) {
    const module = device.createShaderModule({ code });
    return module.getCompilationInfo().then((info) => {
        const errors = info.messages.filter((m) => m.type === "error");
        if (errors.length > 0) {
            const reason = errors.map((e) => `${e.message} (line ${e.lineNum})`).join("; ");
            throw new Error(`Shader compile failed [${label}]: ${reason}`);
        }
        return module;
    });
}

async function createPointGenerator(device, sharedCode) {
    const pointGenSource = `${sharedCode}
@group(0) @binding(0) var<storage, read> params: array<u32>;
@group(0) @binding(1) var<storage, read_write> points_raw: array<u32>;

fn generator_jacobian() -> G1Jacobian {
    var g: G1Jacobian;
    for (var i = 0u; i < NUM_LIMBS; i = i + 1u) {
        g.x.limbs[i] = BN254_ONE_ZR[i];
        g.y.limbs[i] = BN254_ONE_YR[i];
    }
    g.z = g1_one_mont_z();
    return g;
}

fn jacobian_to_affine(pt: G1Jacobian) -> G1Affine {
    var out: G1Affine;
    if (is_g1_zero(pt)) {
        out.x = g1_one_mont_z();
        out.y = g1_one_mont_z();
        return out;
    }
    let z_inv = ff_invert(pt.z);
    let z2_inv = mont_mul_cios(z_inv, z_inv);
    let z3_inv = mont_mul_cios(z2_inv, z_inv);
    out.x = mont_mul_cios(pt.x, z2_inv);
    out.y = mont_mul_cios(pt.y, z3_inv);
    return out;
}

@compute @workgroup_size(1, 1, 1)
fn generate_points(@builtin(global_invocation_id) gid: vec3<u32>) {
    if (gid.x > 0u) { return; }
    let num_points = params[0];
    var g = generator_jacobian();
    var cur = g;
    for (var idx = 0u; idx < num_points; idx = idx + 1u) {
        let aff = jacobian_to_affine(cur);
        let out_base = idx * 16u;
        for (var i = 0u; i < NUM_LIMBS; i = i + 1u) {
            points_raw[out_base + i] = aff.x.limbs[i];
            points_raw[out_base + 8u + i] = aff.y.limbs[i];
        }
        cur = g1_add(cur, g);
    }
}
`;

    const module = await assertShaderCompiles(device, pointGenSource, "point-generator");
    const bgl = device.createBindGroupLayout({
        entries: [
            { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
            { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
        ],
    });
    const pipeline = device.createComputePipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
        compute: { module, entryPoint: "generate_points" },
    });
    return { bgl, pipeline };
}

async function generatePoints(device, pointGen, numPoints) {
    const params = new Uint32Array([numPoints]);
    const paramsBuf = createBuffer(device, params.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "point-params");
    const pointsBuf = createBuffer(device, numPoints * G1_WORDS * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC, "points");
    device.queue.writeBuffer(paramsBuf, 0, params);

    const bg = device.createBindGroup({
        layout: pointGen.bgl,
        entries: [
            { binding: 0, resource: { buffer: paramsBuf } },
            { binding: 1, resource: { buffer: pointsBuf } },
        ],
    });

    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(pointGen.pipeline);
    pass.setBindGroup(0, bg);
    pass.dispatchWorkgroups(1, 1, 1);
    pass.end();
    device.queue.submit([enc.finish()]);

    const points = await readBufferU32(device, pointsBuf, numPoints * G1_WORDS * 4);
    paramsBuf.destroy();
    pointsBuf.destroy();
    return points;
}

async function createReduceHelper(device, commonCode, reduceCode) {
    const module = await assertShaderCompiles(device, `${commonCode}\n${reduceCode}`, "bn254_reduce");
    const pipeline = device.createComputePipeline({
        layout: "auto",
        compute: { module, entryPoint: "fp12_reduce" },
    });
    return { pipeline };
}

async function fp12MulOnGpu(device, reduceHelper, a, b) {
    const combined = new Uint32Array(FP12_WORDS * 2);
    combined.set(a, 0);
    combined.set(b, FP12_WORDS);

    const dataBuffer = createBuffer(
        device,
        combined.byteLength,
        GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC,
        "fp12-data",
    );
    device.queue.writeBuffer(dataBuffer, 0, combined);

    const params = new Uint32Array([1, 1, 0, 0]);
    const paramsBuffer = createBuffer(
        device,
        params.byteLength,
        GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
        "reduce-params",
    );
    device.queue.writeBuffer(paramsBuffer, 0, params);

    const bindGroup = device.createBindGroup({
        layout: reduceHelper.pipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: { buffer: dataBuffer } },
            { binding: 1, resource: { buffer: paramsBuffer } },
        ],
    });

    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(reduceHelper.pipeline);
    pass.setBindGroup(0, bindGroup);
    pass.dispatchWorkgroups(1, 1, 1);
    pass.end();
    device.queue.submit([enc.finish()]);

    const out = await readBufferU32(device, dataBuffer, FP12_WORDS * 4);
    dataBuffer.destroy();
    paramsBuffer.destroy();
    return out;
}

async function run() {
    if (!navigator.gpu) {
        setStatus("WebGPU unavailable in this browser.", "fail");
        return;
    }

    try {
        setStatus("Initializing pairing pipeline...", "warn");
        const pairingReady = await initGpuPairing();
        if (!pairingReady) {
            setStatus("Failed to initialize gpu-pairing.js.", "fail");
            return;
        }

        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
            setStatus("No WebGPU adapter found for helper pipelines.", "fail");
            return;
        }
        const helperDevice = await adapter.requestDevice();

        const shaders = await fetchShaders();
        await Promise.all([
            assertShaderCompiles(helperDevice, `${shaders.common}\n${shaders.miller}`, "bn254_miller"),
            assertShaderCompiles(helperDevice, `${shaders.common}\n${shaders.reduce}`, "bn254_reduce"),
        ]);

        const pointGen = await createPointGenerator(helperDevice, `${shaders.common}\n${shaders.curve}\n`);
        const reduceHelper = await createReduceHelper(helperDevice, shaders.common, shaders.reduce);

        setStatus("Generating test vectors...", "warn");
        const g1Gen = createG1Point(G1_GEN_X, G1_GEN_Y);
        const generated = await generatePoints(helperDevice, pointGen, 2);
        const g1Double = generated.slice(G1_WORDS, G1_WORDS * 2);
        const g2Gen = buildG2GeneratorMontgomery();

        const tests = [
            { name: "G2 serialization check", pairs: 0 },
            { name: "CPU reference (full Miller loop)", pairs: 1 },
            { name: "single pair (G1, G2)", pairs: 1 },
            { name: "2 identical pairs - reduction check", pairs: 2 },
            { name: "4 pairs - reduction check", pairs: 4 },
            { name: "mixed G1 points - independence check", pairs: 2 },
            { name: "8 pairs stress test", pairs: 8 },
            { name: "16 pairs stress test", pairs: 16 },
        ];

        let passCount = 0;

        for (const test of tests) {
            setStatus(`Running: ${test.name}...`, "warn");
            const t0 = performance.now();

            let passed = false;
            let mismatchDetail = "";

            if (test.name === "G2 serialization check") {
                // Verify JS G2 generator Montgomery serialization matches Rust/arkworks
                passed = true;
                const mismatches = [];
                for (let i = 0; i < G2_WORDS; i++) {
                    if (g2Gen[i] !== EXPECTED_G2_GEN[i]) {
                        mismatches.push(`[${i}] expected=${EXPECTED_G2_GEN[i]} got=${g2Gen[i]}`);
                        passed = false;
                    }
                }
                if (!passed) {
                    mismatchDetail = [
                        `${mismatches.length} limb(s) differ:`,
                        ...mismatches.slice(0, 8),
                        "",
                        formatFp12(new Uint32Array([...g2Gen, ...new Uint32Array(64)]), "JS G2 (padded)"),
                        "",
                        formatFp12(new Uint32Array([...EXPECTED_G2_GEN, ...new Uint32Array(64)]), "Expected G2 (padded)"),
                    ].join("\n");
                }
            } else if (test.name === "CPU reference (full Miller loop)") {
                // Compare GPU single-pair output against arkworks multi_miller_loop reference
                // GPU now returns: main loop + Frobenius (no conjugation — X_IS_NEGATIVE=false)
                const gpuResult = await gpuFlatMultiPairing(g1Gen, g2Gen, 1);
                passed = fp12Equal(EXPECTED_FULL_MILLER, gpuResult);
                if (!passed) {
                    mismatchDetail = buildFp12Mismatch(EXPECTED_FULL_MILLER, gpuResult);
                }
            } else if (test.name === "single pair (G1, G2)") {
                const single = await gpuFlatMultiPairing(g1Gen, g2Gen, 1);
                passed = fp12NonZero(single);
                if (!passed) {
                    mismatchDetail = ["Result is all-zero Fp12 value.", "", formatFp12(single, "Observed")].join("\n");
                }
            } else if (test.name === "2 identical pairs - reduction check") {
                const g1Single = repeatPoint(g1Gen, G1_WORDS, 1);
                const g2Single = repeatPoint(g2Gen, G2_WORDS, 1);
                const g1Two = repeatPoint(g1Gen, G1_WORDS, 2);
                const g2Two = repeatPoint(g2Gen, G2_WORDS, 2);

                const f1 = await gpuFlatMultiPairing(g1Single, g2Single, 1);
                const f2 = await gpuFlatMultiPairing(g1Two, g2Two, 2);
                const expected = await fp12MulOnGpu(helperDevice, reduceHelper, f1, f1);
                passed = fp12Equal(expected, f2);
                if (!passed) mismatchDetail = buildFp12Mismatch(expected, f2);
            } else if (test.name === "4 pairs - reduction check") {
                const g1Single = repeatPoint(g1Gen, G1_WORDS, 1);
                const g2Single = repeatPoint(g2Gen, G2_WORDS, 1);
                const g1Four = repeatPoint(g1Gen, G1_WORDS, 4);
                const g2Four = repeatPoint(g2Gen, G2_WORDS, 4);

                const f1 = await gpuFlatMultiPairing(g1Single, g2Single, 1);
                const f4 = await gpuFlatMultiPairing(g1Four, g2Four, 4);
                const f2 = await fp12MulOnGpu(helperDevice, reduceHelper, f1, f1);
                const expected = await fp12MulOnGpu(helperDevice, reduceHelper, f2, f2);
                passed = fp12Equal(expected, f4);
                if (!passed) mismatchDetail = buildFp12Mismatch(expected, f4);
            } else if (test.name === "mixed G1 points - independence check") {
                const g1a = g1Gen;
                const g1b = g1Double;
                const g2Single = repeatPoint(g2Gen, G2_WORDS, 1);

                const fa = await gpuFlatMultiPairing(g1a, g2Single, 1);
                const fb = await gpuFlatMultiPairing(g1b, g2Single, 1);

                const g1Mixed = new Uint32Array(G1_WORDS * 2);
                g1Mixed.set(g1a, 0);
                g1Mixed.set(g1b, G1_WORDS);
                const g2Mixed = repeatPoint(g2Gen, G2_WORDS, 2);
                const fMulti = await gpuFlatMultiPairing(g1Mixed, g2Mixed, 2);

                const expected = await fp12MulOnGpu(helperDevice, reduceHelper, fa, fb);
                passed = fp12Equal(expected, fMulti);
                if (!passed) mismatchDetail = buildFp12Mismatch(expected, fMulti);
            } else if (test.name === "8 pairs stress test") {
                const g1 = repeatPoint(g1Gen, G1_WORDS, 8);
                const g2 = repeatPoint(g2Gen, G2_WORDS, 8);
                const f8 = await gpuFlatMultiPairing(g1, g2, 8);
                passed = fp12NonZero(f8);
                if (!passed) {
                    mismatchDetail = ["Result is all-zero Fp12 value.", "", formatFp12(f8, "Observed")].join("\n");
                }
            } else if (test.name === "16 pairs stress test") {
                const g1 = repeatPoint(g1Gen, G1_WORDS, 16);
                const g2 = repeatPoint(g2Gen, G2_WORDS, 16);
                const f16 = await gpuFlatMultiPairing(g1, g2, 16);
                passed = fp12NonZero(f16);
                if (!passed) {
                    mismatchDetail = ["Result is all-zero Fp12 value.", "", formatFp12(f16, "Observed")].join("\n");
                }
            }

            const t1 = performance.now();
            if (passed) passCount += 1;

            appendResultRow({
                testName: test.name,
                numPairs: test.pairs,
                passed,
                timing: `${(t1 - t0).toFixed(1)}ms`,
                mismatchDetail,
            });
        }

        setStatus(
            `Done: ${passCount}/${tests.length} tests passed.`,
            passCount === tests.length ? "pass" : "fail",
        );
    } catch (err) {
        console.error(err);
        setStatus(`Error: ${err instanceof Error ? err.message : String(err)}`, "fail");
    }
}

run();
</script>
