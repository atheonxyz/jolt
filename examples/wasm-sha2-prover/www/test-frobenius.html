<!DOCTYPE html>
<html><head><title>Frobenius Test</title></head>
<body>
<pre id="out">Running...</pre>
<script type="module">
const out = document.getElementById("out");
try {
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();
  const commonResp = await fetch('/shaders/bn254_common.wgsl');
  const commonSrc = await commonResp.text();

  const testCode = commonSrc + `
@group(0) @binding(0) var<storage, read> input_data: array<u32>;
@group(0) @binding(1) var<storage, read_write> output_data: array<u32>;

fn load_g2(offset: u32) -> G2Affine {
    var q: G2Affine;
    for (var i = 0u; i < 8u; i = i + 1u) {
        q.x.c0.limbs[i] = input_data[offset + i];
        q.x.c1.limbs[i] = input_data[offset + 8u + i];
        q.y.c0.limbs[i] = input_data[offset + 16u + i];
        q.y.c1.limbs[i] = input_data[offset + 24u + i];
    }
    return q;
}

fn store_g2(q: G2Affine, offset: u32) {
    for (var i = 0u; i < 8u; i = i + 1u) {
        output_data[offset + i] = q.x.c0.limbs[i];
        output_data[offset + 8u + i] = q.x.c1.limbs[i];
        output_data[offset + 16u + i] = q.y.c0.limbs[i];
        output_data[offset + 24u + i] = q.y.c1.limbs[i];
    }
}

@compute @workgroup_size(1)
fn test_main(@builtin(global_invocation_id) gid: vec3u) {
    let q = load_g2(0u);
    let q1 = g2_mul_by_char(q);
    store_g2(q1, 0u);
}
`;

  const mod = device.createShaderModule({ code: testCode });
  const pipe = device.createComputePipeline({
    layout: 'auto',
    compute: { module: mod, entryPoint: 'test_main' }
  });

  // G2 generator Montgomery limbs (verified correct)
  const g2Gen = new Uint32Array([
    45883430, 2390996433, 1232798066, 3706394933, 2541820639, 4223149639, 2945863739, 425146433,
    2823577920, 2947838845, 1476581572, 1615060314, 1386229638, 166285564, 988445547, 352252035,
    2288773622, 1637743261, 4120812408, 4269789847, 589004286, 4288551522, 2929607174, 687701739,
    3340261102, 1678334806, 847068347, 3696752930, 859115638, 1442395582, 2482857090, 228892902
  ]);

  const ib = device.createBuffer({ size: 128, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const ob = device.createBuffer({ size: 128, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  const rb = device.createBuffer({ size: 128, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(ib, 0, g2Gen);

  const bg = device.createBindGroup({
    layout: pipe.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: ib } },
      { binding: 1, resource: { buffer: ob } },
    ]
  });

  const enc = device.createCommandEncoder();
  const p = enc.beginComputePass();
  p.setPipeline(pipe);
  p.setBindGroup(0, bg);
  p.dispatchWorkgroups(1);
  p.end();
  enc.copyBufferToBuffer(ob, 0, rb, 0, 128);
  device.queue.submit([enc.finish()]);
  await rb.mapAsync(GPUMapMode.READ);
  const res = new Uint32Array(rb.getMappedRange().slice(0));
  rb.unmap();

  // Expected Q1 from Rust
  const exp = new Uint32Array([
    0x6d0d8acf, 0x6244d29d, 0xf88dbcf6, 0x60190a36, 0xa74b4532, 0x2ec4693b, 0x568104e7, 0x2b2271a1,
    0x7543f52b, 0x3b92c2ca, 0xd7bf2769, 0x3e3e70cf, 0xfa23a8ba, 0x866d2618, 0xbd041be7, 0x05870fdc,
    0x7d512efc, 0x40d316f1, 0x90ef92be, 0x01ee8002, 0x8be26818, 0xaaf14b7d, 0x67032ab2, 0x0fdd29ec,
    0xb83e939f, 0x2cc454e2, 0x59e9a041, 0xdbe96c73, 0x4a62d6c9, 0xe438faca, 0xb18fef88, 0x0a965e89
  ]);

  const hex = x => '0x' + (x >>> 0).toString(16).padStart(8, '0');
  let lines = [];
  let ok = true;
  for (let i = 0; i < 32; i++) {
    if (res[i] !== exp[i]) {
      ok = false;
      lines.push(`[${i}] MISMATCH exp=${hex(exp[i])} got=${hex(res[i])}`);
    }
  }

  if (ok) {
    out.textContent = "PASS: g2_mul_by_char matches Rust reference!";
  } else {
    lines.unshift("FAIL: g2_mul_by_char mismatch");
    lines.push("");
    lines.push("GPU Q1 output:");
    for (let i = 0; i < 4; i++) {
      const row = [];
      for (let j = 0; j < 8; j++) row.push(hex(res[i*8+j]));
      lines.push(`  [${i}] ${row.join(', ')}`);
    }
    lines.push("");
    lines.push("Expected Q1:");
    for (let i = 0; i < 4; i++) {
      const row = [];
      for (let j = 0; j < 8; j++) row.push(hex(exp[i*8+j]));
      lines.push(`  [${i}] ${row.join(', ')}`);
    }
    out.textContent = lines.join("\n");
  }
  device.destroy();
} catch(e) {
  out.textContent = "ERROR: " + e.message + "\n" + e.stack;
}
</script>
</body>
</html>
