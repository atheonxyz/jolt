<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
    <title>GPU MSM Pipeline Test</title>
    <style>
        :root {
            --bg: #f4f6f8;
            --panel: #ffffff;
            --ink: #1d2a3a;
            --muted: #5c6776;
            --pass: #1f8a5a;
            --fail: #c0392b;

        * { box-sizing: border-box; }

            margin: 0;
            font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
            color: var(--ink);

                radial-gradient(circle at 20% -10%, #dbe9ff 0%, transparent 45%),

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(29, 42, 58, 0.08);
            padding: 1rem;
            margin-bottom: 1rem;
        }

        h1 {
            margin: 0 0 0.4rem;
            font-size: clamp(1.4rem, 2.3vw, 2rem);
            color: #143b66;
        }

        table {
            width: 100%;

            font-size: 0.92rem;

        }

        th, td {

            vertical-align: top;
            word-break: break-word;
        }

        th {
            color: #26435f;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .pass { color: var(--pass); font-weight: 700; }
        .fail { color: var(--fail); font-weight: 700; }
        .warn { color: var(--warn); font-weight: 700; }

        details {
            margin-top: 0.4rem;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0.45rem 0.55rem;
            background: #fbfcfe;
        }

        summary {
            cursor: pointer;
            color: #294966;
            font-weight: 700;
        }

        pre {
            margin: 0.45rem 0 0;
            background: #f7f9fc;
            border: 1px solid #e6ebf3;

            padding: 0.65rem;

            white-space: pre-wrap;

            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        }

        @media (max-width: 760px) {
            main { width: calc(100% - 1rem); margin-top: 0.8rem; }
            .card { padding: 0.75rem; }
            th, td { font-size: 0.82rem; padding: 0.45rem 0.35rem; }
            pre { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<main>
    <section class="card">
        <h1>GPU MSM Pipeline vs Naive GPU Reference</h1>
        <p>Runs fully in-browser with WebGPU (no WASM).</p>
        <p id="status">Initializing...</p>
    </section>

    <section class="card">
        <table>
            <thead>
            <tr>
                <th>Test</th>
                <th>Points</th>
                <th>Batch</th>
                <th>Scalar Bits</th>
                <th>Window</th>
                <th>Result</th>
                <th>Timing</th>
            </tr>
            </thead>
            <tbody id="results-body"></tbody>
        </table>
    </section>
</main>

<script type="module">
import { initGPUMSM, executeGPUBatchMSM } from "./gpu-msm.js";

const NUM_LIMBS = 8;
const PT_STRIDE = 16;
const SHADER_PATHS = {
    common: "./shaders/bn254_common.wgsl",
    curve: "./shaders/msm_g1_curve.wgsl",
    cscSetup: "./shaders/msm_csc_setup.wgsl",
    smvp: "./shaders/msm_smvp.wgsl",
    pbpr: "./shaders/msm_pbpr.wgsl",
    horner: "./shaders/msm_horner.wgsl",
    naive: "./shaders/msm_naive_ref.wgsl",
};

const BN254_MODULUS = new Uint32Array([
    3632069959, 1008765974, 1752287885, 2541841041,
    2172737629, 3092268470, 3778125865, 811880050,
]);

const statusEl = document.getElementById("status");
const resultsBody = document.getElementById("results-body");

function setStatus(msg, cls = "") {
    statusEl.textContent = msg;
    statusEl.className = cls;
}

function optimalWindowSize(inputSize, scalarBits) {
    if (inputSize > 16_777_216) return 16;
    if (inputSize >= 262_144) return 15;
    const DISPATCH_OVERHEAD = 1024;
    const wMin = inputSize < 8 ? 12 : 10;
    let bestW = wMin;
    let bestCost = Number.MAX_SAFE_INTEGER;
    for (let w = wMin; w <= 14; w += 1) {
        const subtasks = Math.ceil(scalarBits / w);
        const halfCols = 1 << (w - 1);
        const cost = subtasks * (inputSize + halfCols + DISPATCH_OVERHEAD);
        if (cost < bestCost) {
            bestCost = cost;
            bestW = w;
        }
    }
    return bestW;
}

function mulberry32(seed) {
    let t = seed >>> 0;
    return () => {
        t = (t + 0x6d2b79f5) >>> 0;
        let x = Math.imul(t ^ (t >>> 15), t | 1);
        x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
        return ((x ^ (x >>> 14)) >>> 0);
    };
}

function scalarFromU32(value) {
    const out = new Uint32Array(NUM_LIMBS);
    out[0] = value >>> 0;
    return out;
}

function subModulusByU32(k) {
    const out = new Uint32Array(BN254_MODULUS);
    let borrow = k >>> 0;
    for (let i = 0; i < NUM_LIMBS; i += 1) {
        const val = out[i] >>> 0;
        const next = (val - borrow) >>> 0;
        out[i] = next;
        borrow = (val < borrow) ? 1 : 0;
        if (borrow === 0) break;
    }
    return out;
}

function maskScalarToBitWidth(limbs, bitWidth) {
    const out = new Uint32Array(limbs);
    if (bitWidth >= 256) return out;
    const fullLimbs = Math.floor(bitWidth / 32);
    const rem = bitWidth % 32;
    for (let i = fullLimbs + (rem > 0 ? 1 : 0); i < NUM_LIMBS; i += 1) {
        out[i] = 0;
    }
    if (rem > 0) {
        out[fullLimbs] &= ((1 << rem) - 1) >>> 0;
    }
    return out;
}

function makeScalarMatrix(numPoints, batchSize, bitWidth, generator) {
    const total = numPoints * batchSize;
    const out = new Uint32Array(total * NUM_LIMBS);
    for (let idx = 0; idx < total; idx += 1) {
        const limbs = maskScalarToBitWidth(generator(idx), bitWidth);
        out.set(limbs, idx * NUM_LIMBS);
    }
    return out;
}

function formatLimbs(limbs, offset) {
    const words = [];
    for (let i = 0; i < NUM_LIMBS; i += 1) {
        words.push(`0x${(limbs[offset + i] >>> 0).toString(16).padStart(8, "0")}`);
    }
    return `[${words.join(", ")}]`;
}

function formatPoint(resultData, msmIdx) {
    const base = msmIdx * 24;
    const x = formatLimbs(resultData, base);
    const y = formatLimbs(resultData, base + 8);
    const z = formatLimbs(resultData, base + 16);
    return `x=${x}\ny=${y}\nz=${z}`;
}

function appendResultRow({
    testName,
    numPoints,
    batchSize,
    scalarBitWidth,
    windowSize,
    passed,
    timing,
    mismatchDetail,
}) {
    const row = document.createElement("tr");
    row.innerHTML = `
        <td>${testName}</td>
        <td>${numPoints}</td>
        <td>${batchSize}</td>
        <td>${scalarBitWidth}</td>
        <td>${windowSize}</td>
        <td class="${passed ? "pass" : "fail"}">${passed ? "PASS" : "FAIL"}</td>
        <td>${timing}</td>
    `;
    resultsBody.appendChild(row);

    if (!passed && mismatchDetail) {
        const detailRow = document.createElement("tr");
        detailRow.innerHTML = `<td colspan="7"></td>`;
        const cell = detailRow.firstElementChild;
        const details = document.createElement("details");
        details.open = true;
        const summary = document.createElement("summary");
        summary.textContent = "Mismatch details";
        const pre = document.createElement("pre");
        pre.textContent = mismatchDetail;
        details.appendChild(summary);
        details.appendChild(pre);
        cell.appendChild(details);
        resultsBody.appendChild(detailRow);
    }
}

async function fetchShaders() {
    const entries = await Promise.all(Object.entries(SHADER_PATHS).map(async ([name, path]) => {
        const resp = await fetch(path);
        if (!resp.ok) {
            throw new Error(`Failed to fetch ${path}: HTTP ${resp.status}`);
        }
        return [name, await resp.text()];
    }));
    return Object.fromEntries(entries);
}

function assertShaderCompiles(device, code, label) {
    const module = device.createShaderModule({ code });
    return module.getCompilationInfo().then((info) => {
        const errors = info.messages.filter((m) => m.type === "error");
        if (errors.length > 0) {
            const reason = errors.map((e) => `${e.message} (line ${e.lineNum})`).join("; ");
            throw new Error(`Shader compile failed [${label}]: ${reason}`);
        }
        return module;
    });
}

async function createPointGenerator(device, sharedCode) {
    const pointGenSource = `${sharedCode}
@group(0) @binding(0) var<storage, read> params: array<u32>;
@group(0) @binding(1) var<storage, read_write> points_raw: array<u32>;

fn generator_jacobian() -> G1Jacobian {
    var g: G1Jacobian;
    for (var i = 0u; i < NUM_LIMBS; i = i + 1u) {
        g.x.limbs[i] = BN254_ONE_ZR[i];
        g.y.limbs[i] = BN254_ONE_YR[i];
    }
    g.z = g1_one_mont_z();
    return g;
}

fn jacobian_to_affine(pt: G1Jacobian) -> G1Affine {
    var out: G1Affine;
    if (is_g1_zero(pt)) {
        out.x = g1_one_mont_z();
        out.y = g1_one_mont_z();
        return out;
    }
    let z_inv = ff_invert(pt.z);
    let z2_inv = mont_mul_cios(z_inv, z_inv);
    let z3_inv = mont_mul_cios(z2_inv, z_inv);
    out.x = mont_mul_cios(pt.x, z2_inv);
    out.y = mont_mul_cios(pt.y, z3_inv);
    return out;
}

@compute @workgroup_size(1, 1, 1)
fn generate_points(@builtin(global_invocation_id) gid: vec3<u32>) {
    if (gid.x > 0u) { return; }
    let num_points = params[0];
    var g = generator_jacobian();
    var cur = g;
    for (var idx = 0u; idx < num_points; idx = idx + 1u) {
        let aff = jacobian_to_affine(cur);
        let out_base = idx * 16u;
        for (var i = 0u; i < NUM_LIMBS; i = i + 1u) {
            points_raw[out_base + i] = aff.x.limbs[i];
            points_raw[out_base + 8u + i] = aff.y.limbs[i];
        }
        cur = g1_add(cur, g);
    }
}
`;

    const module = await assertShaderCompiles(device, pointGenSource, "point-generator");
    const bgl = device.createBindGroupLayout({
        entries: [
            { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
            { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
        ],
    });
    const pipeline = device.createComputePipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
        compute: { module, entryPoint: "generate_points" },
    });

    return { bgl, pipeline };
}

async function createNaiveRunner(device, sharedCode, naiveCode) {
    const module = await assertShaderCompiles(device, `${sharedCode}\n${naiveCode}`, "naive-msm");
    const bgl = device.createBindGroupLayout({
        entries: [
            { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
            { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
            { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
            { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
        ],
    });
    const pipeline = device.createComputePipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
        compute: { module, entryPoint: "naive_msm" },
    });
    return { bgl, pipeline };
}

async function createComparator(device, sharedCode) {
    const compareSource = `${sharedCode}
@group(0) @binding(0) var<storage, read> lhs: array<BigInt>;
@group(0) @binding(1) var<storage, read> rhs: array<BigInt>;
@group(0) @binding(2) var<storage, read_write> out_flags: array<u32>;

@compute @workgroup_size(64, 1, 1)
fn compare_results(@builtin(global_invocation_id) gid: vec3<u32>) {
    let idx = gid.x;
    if (idx >= arrayLength(&out_flags)) { return; }

    let base = 3u * idx;
    var a: G1Jacobian;
    a.x = lhs[base];
    a.y = lhs[base + 1u];
    a.z = lhs[base + 2u];

    var b: G1Jacobian;
    b.x = rhs[base];
    b.y = rhs[base + 1u];
    b.z = rhs[base + 2u];

    if (is_g1_zero(a) && is_g1_zero(b)) {
        out_flags[idx] = 1u;
        return;
    }
    if (is_g1_zero(a) != is_g1_zero(b)) {
        out_flags[idx] = 0u;
        return;
    }

    let z1z1 = mont_mul_cios(a.z, a.z);
    let z2z2 = mont_mul_cios(b.z, b.z);
    let x1n = mont_mul_cios(a.x, z2z2);
    let x2n = mont_mul_cios(b.x, z1z1);
    if (!bigint_eq(x1n, x2n)) {
        out_flags[idx] = 0u;
        return;
    }

    let z1z3 = mont_mul_cios(z1z1, a.z);
    let z2z3 = mont_mul_cios(z2z2, b.z);
    let y1n = mont_mul_cios(a.y, z2z3);
    let y2n = mont_mul_cios(b.y, z1z3);
    out_flags[idx] = select(0u, 1u, bigint_eq(y1n, y2n));
}
`;

    const module = await assertShaderCompiles(device, compareSource, "result-compare");
    const bgl = device.createBindGroupLayout({
        entries: [
            { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
            { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
            { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
        ],
    });
    const pipeline = device.createComputePipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
        compute: { module, entryPoint: "compare_results" },
    });
    return { bgl, pipeline };
}

function createBuffer(device, size, usage, label) {
    return device.createBuffer({ size: Math.max(size, 4), usage, label });
}

async function readBufferU32(device, srcBuffer, byteLength) {
    const staging = createBuffer(device, byteLength, GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ, "staging");
    const enc = device.createCommandEncoder();
    enc.copyBufferToBuffer(srcBuffer, 0, staging, 0, byteLength);
    device.queue.submit([enc.finish()]);
    await staging.mapAsync(GPUMapMode.READ);
    const out = new Uint32Array(staging.getMappedRange().slice(0));
    staging.unmap();
    staging.destroy();
    return out;
}

async function generatePoints(device, pointGen, numPoints) {
    const params = new Uint32Array([numPoints]);
    const paramsBuf = createBuffer(device, params.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "point-params");
    const pointsBuf = createBuffer(device, numPoints * PT_STRIDE * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC, "points");
    device.queue.writeBuffer(paramsBuf, 0, params);

    const bg = device.createBindGroup({
        layout: pointGen.bgl,
        entries: [
            { binding: 0, resource: { buffer: paramsBuf } },
            { binding: 1, resource: { buffer: pointsBuf } },
        ],
    });

    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(pointGen.pipeline);
    pass.setBindGroup(0, bg);
    pass.dispatchWorkgroups(1, 1, 1);
    pass.end();
    device.queue.submit([enc.finish()]);

    const points = await readBufferU32(device, pointsBuf, numPoints * PT_STRIDE * 4);
    paramsBuf.destroy();
    pointsBuf.destroy();
    return points;
}

async function runNaiveMSM(device, naive, pointsFlat, scalarsFlat, numPoints, batchSize, scalarBitWidth) {
    const pointsBuf = createBuffer(device, pointsFlat.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "naive-points");
    const scalarsBuf = createBuffer(device, scalarsFlat.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "naive-scalars");
    const params = new Uint32Array([numPoints, batchSize, scalarBitWidth]);
    const paramsBuf = createBuffer(device, params.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "naive-params");
    const resultByteLength = batchSize * 24 * 4;
    const resultsBuf = createBuffer(device, resultByteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC, "naive-results");

    device.queue.writeBuffer(pointsBuf, 0, pointsFlat);
    device.queue.writeBuffer(scalarsBuf, 0, scalarsFlat);
    device.queue.writeBuffer(paramsBuf, 0, params);

    const bg = device.createBindGroup({
        layout: naive.bgl,
        entries: [
            { binding: 0, resource: { buffer: pointsBuf } },
            { binding: 1, resource: { buffer: scalarsBuf } },
            { binding: 2, resource: { buffer: paramsBuf } },
            { binding: 3, resource: { buffer: resultsBuf } },
        ],
    });

    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(naive.pipeline);
    pass.setBindGroup(0, bg);
    pass.dispatchWorkgroups(Math.ceil(batchSize / 64), 1, 1);
    pass.end();
    device.queue.submit([enc.finish()]);

    const result = await readBufferU32(device, resultsBuf, resultByteLength);
    pointsBuf.destroy();
    scalarsBuf.destroy();
    paramsBuf.destroy();
    resultsBuf.destroy();
    return result;
}

async function compareProjective(device, comparator, lhs, rhs, batchSize) {
    const byteLength = batchSize * 24 * 4;
    const lhsBuf = createBuffer(device, byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "cmp-lhs");
    const rhsBuf = createBuffer(device, byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "cmp-rhs");
    const flagsBuf = createBuffer(device, batchSize * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC, "cmp-flags");

    device.queue.writeBuffer(lhsBuf, 0, lhs);
    device.queue.writeBuffer(rhsBuf, 0, rhs);

    const bg = device.createBindGroup({
        layout: comparator.bgl,
        entries: [
            { binding: 0, resource: { buffer: lhsBuf } },
            { binding: 1, resource: { buffer: rhsBuf } },
            { binding: 2, resource: { buffer: flagsBuf } },
        ],
    });

    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(comparator.pipeline);
    pass.setBindGroup(0, bg);
    pass.dispatchWorkgroups(Math.ceil(batchSize / 64), 1, 1);
    pass.end();
    device.queue.submit([enc.finish()]);

    const flags = await readBufferU32(device, flagsBuf, batchSize * 4);
    lhsBuf.destroy();
    rhsBuf.destroy();
    flagsBuf.destroy();
    return flags;
}

function buildTests() {
    return [
        {
            name: "single-point fixed scalars",
            numPoints: 1,
            batchSize: 4,
            scalarBitWidth: 8,
            scalars: (() => {
                const data = new Uint32Array(4 * NUM_LIMBS);
                data.set(scalarFromU32(1), 0 * NUM_LIMBS);
                data.set(scalarFromU32(2), 1 * NUM_LIMBS);
                data.set(scalarFromU32(3), 2 * NUM_LIMBS);
                data.set(scalarFromU32(0), 3 * NUM_LIMBS);
                return data;
            })(),
        },
        {
            name: "multi-point all ones",
            numPoints: 4,
            batchSize: 2,
            scalarBitWidth: 8,
            scalars: makeScalarMatrix(4, 2, 8, () => scalarFromU32(1)),
        },
        {
            name: "64 points sequential",
            numPoints: 64,
            batchSize: 4,
            scalarBitWidth: 16,
            scalars: makeScalarMatrix(64, 4, 16, (idx) => scalarFromU32((idx % 251) + 1)),
        },
        {
            name: "128x128 random seed 0xC0FFEE01",
            numPoints: 128,
            batchSize: 128,
            scalarBitWidth: 256,
            scalars: (() => {
                const rng = mulberry32(0xC0FFEE01);
                return makeScalarMatrix(128, 128, 256, () => {
                    const v = new Uint32Array(NUM_LIMBS);
                    for (let i = 0; i < NUM_LIMBS; i += 1) v[i] = rng();
                    return v;
                });
            })(),
        },
        {
            name: "2048x2 sparse zeros",
            numPoints: 2048,
            batchSize: 2,
            scalarBitWidth: 16,
            scalars: makeScalarMatrix(2048, 2, 16, (idx) => {
                if ((idx % 11) !== 0) return scalarFromU32(0);
                return scalarFromU32((idx % 257) + 1);
            }),
        },
        {
            name: "64x4 near-modulus negatives",
            numPoints: 64,
            batchSize: 4,
            scalarBitWidth: 256,
            scalars: makeScalarMatrix(64, 4, 256, (idx) => subModulusByU32((idx % 97) + 1)),
        },
    ];
}

async function run() {
    if (!navigator.gpu) {
        setStatus("WebGPU unavailable in this browser.", "fail");
        return;
    }

    try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
            setStatus("No WebGPU adapter found.", "fail");
            return;
        }

        const device = await adapter.requestDevice();
        const shaders = await fetchShaders();
        const sharedCode = `${shaders.common}\n${shaders.curve}\n`;

        await Promise.all([
            assertShaderCompiles(device, shaders.cscSetup, "msm_csc_setup.wgsl"),
            assertShaderCompiles(device, sharedCode + shaders.smvp, "msm_smvp.wgsl"),
            assertShaderCompiles(device, sharedCode + shaders.pbpr, "msm_pbpr.wgsl"),
            assertShaderCompiles(device, sharedCode + shaders.horner, "msm_horner.wgsl"),
            assertShaderCompiles(device, sharedCode + shaders.naive, "msm_naive_ref.wgsl"),
        ]);

        await initGPUMSM(device);
        const pointGen = await createPointGenerator(device, sharedCode);
        const naive = await createNaiveRunner(device, sharedCode, shaders.naive);
        const comparator = await createComparator(device, sharedCode);

        const tests = buildTests();
        const pointCache = new Map();
        let passCount = 0;

        for (const test of tests) {
            setStatus(`Running: ${test.name}...`, "warn");
            const key = String(test.numPoints);
            if (!pointCache.has(key)) {
                pointCache.set(key, await generatePoints(device, pointGen, test.numPoints));
            }
            const points = pointCache.get(key);

            const t0 = performance.now();
            const pippenger = await executeGPUBatchMSM(
                points,
                test.scalars,
                test.numPoints,
                test.scalarBitWidth,
                test.batchSize,
            );
            const t1 = performance.now();
            const naiveResult = await runNaiveMSM(
                device,
                naive,
                points,
                test.scalars,
                test.numPoints,
                test.batchSize,
                test.scalarBitWidth,
            );
            const t2 = performance.now();
            const flags = await compareProjective(device, comparator, pippenger, naiveResult, test.batchSize);
            const t3 = performance.now();

            const bad = [];
            for (let i = 0; i < flags.length; i += 1) {
                if (flags[i] !== 1) bad.push(i);
            }

            const passed = bad.length === 0;
            if (passed) passCount += 1;

            let mismatchDetail = "";
            if (!passed) {
                const subset = bad.slice(0, 3);
                mismatchDetail = subset.map((msmIdx) => {
                    return [
                        `MSM index ${msmIdx}`,
                        `Pippenger:\n${formatPoint(pippenger, msmIdx)}`,
                        `Naive:\n${formatPoint(naiveResult, msmIdx)}`,
                    ].join("\n");
                }).join("\n\n");
                if (bad.length > subset.length) {
                    mismatchDetail += `\n\n... ${bad.length - subset.length} additional mismatches not shown`;
                }
            }

            appendResultRow({
                testName: test.name,
                numPoints: test.numPoints,
                batchSize: test.batchSize,
                scalarBitWidth: test.scalarBitWidth,
                windowSize: optimalWindowSize(test.numPoints, test.scalarBitWidth),
                passed,
                timing: `pip ${(t1 - t0).toFixed(1)}ms, ref ${(t2 - t1).toFixed(1)}ms, cmp ${(t3 - t2).toFixed(1)}ms`,
                mismatchDetail,
            });
        }

        setStatus(
            `Done: ${passCount}/${tests.length} tests passed.`,
            passCount === tests.length ? "pass" : "fail",
        );
    } catch (err) {
        console.error(err);
        setStatus(`Error: ${err instanceof Error ? err.message : String(err)}`, "fail");
    }
}

run();
</script>
