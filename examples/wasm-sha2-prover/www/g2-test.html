/**
 * Convert a Jolt reference G2Affine (32 u32s) to G2Jacobian (48 u32s) by appending z = fp2_one.
 * For identity (null), returns g2j_zero (x=fp2_one, y=fp2_one, z=fp2_zero).
 */
function affineToJacobian(affine) {
    const jac = new Uint32Array(G2_JACOBIAN_WORDS);
    if (affine === null) {
        // identity: x = fp2_one, y = fp2_one, z = fp2_zero
        jac.set(FP_ONE_MONT, 0);                  // x.c0 = R mod p
        // x.c1 = 0 (already zeroed)
        jac.set(FP_ONE_MONT, 2 * NUM_LIMBS);        // y.c0 = R mod p
        // y.c1 = 0, z.c0 = 0, z.c1 = 0 (already zeroed)
        return jac;
    }
    jac.set(affine, 0);                              // copy x.c0, x.c1, y.c0, y.c1
    jac.set(FP_ONE_MONT, 4 * NUM_LIMBS);             // z.c0 = R mod p
    // z.c1 = 0 (already zeroed)
    return jac;
}

/**
 * Build a flat G2Jacobian buffer from an array of Jolt reference values (null or Uint32Array).
 */
function buildJoltRefJacobians(refs) {
    const out = new Uint32Array(refs.length * G2_JACOBIAN_WORDS);
    for (let i = 0; i < refs.length; i++) {
        out.set(affineToJacobian(refs[i]), i * G2_JACOBIAN_WORDS);
    }
    return out;
}

function mulberry32(seed) {
    let t = seed >>> 0;
    return () => {
        t = (t + 0x6d2b79f5) >>> 0;
        let x = Math.imul(t ^ (t >>> 15), t | 1);
        x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
        return ((x ^ (x >>> 14)) >>> 0);
    };
}

function scalarFromU32(value) {
    const out = new Uint32Array(NUM_LIMBS);
    out[0] = value >>> 0;
    return out;
}

function frModulusMinusU32(k) {
    const out = new Uint32Array(FR_MODULUS);
    let borrow = k >>> 0;
    for (let i = 0; i < NUM_LIMBS; i += 1) {
        const val = out[i] >>> 0;
        const next = (val - borrow) >>> 0;
        out[i] = next;
        borrow = (val < borrow) ? 1 : 0;
        if (borrow === 0) break;
    }
    return out;
}

function randomScalarBatch(count, seed) {
    const rng = mulberry32(seed);
    const out = new Uint32Array(count * NUM_LIMBS);
    for (let i = 0; i < out.length; i += 1) {
        out[i] = rng();
    }
    // Clear bit 255 of each scalar — GPU processes 255 bits (0-254) only
    for (let s = 0; s < count; s += 1) {
        out[s * NUM_LIMBS + 7] &= 0x7FFFFFFF;
    }
    return out;
}

function formatU32Limbs(limbs, offset, count = NUM_LIMBS) {
    const words = [];
    for (let i = 0; i < count; i += 1) {
        words.push(`0x${(limbs[offset + i] >>> 0).toString(16).padStart(8, "0")}`);
    }
    return `[${words.join(", ")}]`;
}

function limbsToBigInt(limbs, offset) {
    let out = 0n;
    for (let i = NUM_LIMBS - 1; i >= 0; i -= 1) {
        out = (out << 32n) + BigInt(limbs[offset + i] >>> 0);
    }
    return out;
}

function formatFp2Limbs(data, offset) {
    const c0 = limbsToBigInt(data, offset);
    const c1 = limbsToBigInt(data, offset + NUM_LIMBS);
    return `c0=0x${c0.toString(16)}
c1=0x${c1.toString(16)}`;
}

function formatG2Point(data, msmIdx) {
    const base = msmIdx * G2_JACOBIAN_WORDS;
    return [
        "x:",
        formatFp2Limbs(data, base),
        "y:",
        formatFp2Limbs(data, base + 16),
        "z:",
        formatFp2Limbs(data, base + 32),
    ].join("\n");
}

function appendResultRow({ testName, numScalars, passedNaive, passedJolt, timing, mismatchDetail }) {
    const row = document.createElement("tr");
    const naiveCls = passedNaive ? "pass" : "fail";

}

async function fetchShaders() {
    const entries = await Promise.all(Object.entries(SHADER_PATHS).map(async ([name, path]) => {
        const resp = await fetch(path);
        if (!resp.ok) {
            throw new Error(`Failed to fetch ${path}: HTTP ${resp.status}`);
        }
        return [name, await resp.text()];
    }));
    return Object.fromEntries(entries);
}

function assertShaderCompiles(device, code, label) {
    const module = device.createShaderModule({ code });
    return module.getCompilationInfo().then((info) => {
        const errors = info.messages.filter((m) => m.type === "error");
        if (errors.length > 0) {
            const reason = errors.map((e) => `${e.message} (line ${e.lineNum})`).join("; ");
            throw new Error(`Shader compile failed [${label}]: ${reason}`);
        }
        return module;
    });
}

const G2_ARITHMETIC = `
fn g2j_is_zero(a: G2Jacobian) -> bool {
    return fp2_is_zero(a.z);
}

fn g2j_zero() -> G2Jacobian {
    var r: G2Jacobian;
    r.x = fp2_one();
    r.y = fp2_one();
    r.z = fp2_zero();
    return r;
}

fn g2j_from_affine(a: G2Affine) -> G2Jacobian {
    var r: G2Jacobian;
    r.x = a.x;
    r.y = a.y;
    r.z = fp2_one();
    return r;
}

fn g2j_dbl(pt: G2Jacobian) -> G2Jacobian {
    let x = pt.x;
    let y = pt.y;
    let z = pt.z;

    let a = fp2_sqr(x);
    let b = fp2_sqr(y);
    let c = fp2_sqr(b);

    let x1b = fp2_add(x, b);
    let x1b2 = fp2_sqr(x1b);
    let ac = fp2_add(a, c);
    let x1b2ac = fp2_sub(x1b2, ac);
    let d = fp2_double(x1b2ac);

    let a2 = fp2_double(a);
    let e = fp2_add(a2, a);

    let f = fp2_sqr(e);

    let d2 = fp2_double(d);
    let x3 = fp2_sub(f, d2);

    let c2 = fp2_double(c);
    let c4 = fp2_double(c2);
    let c8 = fp2_double(c4);

    let dx3 = fp2_sub(d, x3);
    let edx3 = fp2_mul(e, dx3);
    let y3 = fp2_sub(edx3, c8);

    let y1z1 = fp2_mul(y, z);
    let z3 = fp2_double(y1z1);

    var result: G2Jacobian;
    result.x = x3;
    result.y = y3;
    result.z = z3;
    return result;
}

fn g2j_madd(a_pt: G2Jacobian, b_pt: G2Affine) -> G2Jacobian {
    if (g2j_is_zero(a_pt)) {
        return g2j_from_affine(b_pt);
    }

    let x1 = a_pt.x;
    let y1 = a_pt.y;
    let z1 = a_pt.z;
    let x2 = b_pt.x;
    let y2 = b_pt.y;

    let z1z1 = fp2_sqr(z1);

    let u2 = fp2_mul(x2, z1z1);

    let temp_s2 = fp2_mul(y2, z1);
    let s2 = fp2_mul(temp_s2, z1z1);

    let h = fp2_sub(u2, x1);

    if (fp2_is_zero(h)) {
        let s2_minus_y1 = fp2_sub(s2, y1);
        if (fp2_is_zero(s2_minus_y1)) {
            return g2j_dbl(a_pt);
        } else {
            return g2j_zero();
        }
    }

    let hh = fp2_sqr(h);

    var i_val = fp2_double(hh);
    i_val = fp2_double(i_val);

    let j = fp2_mul(h, i_val);

    let s2_minus_y1 = fp2_sub(s2, y1);
    let r = fp2_double(s2_minus_y1);

    let v = fp2_mul(x1, i_val);

    let r2 = fp2_sqr(r);
    let v2 = fp2_double(v);
    let jv2 = fp2_add(j, v2);
    let x3 = fp2_sub(r2, jv2);

    let v_minus_x3 = fp2_sub(v, x3);
    let r_vmx3 = fp2_mul(r, v_minus_x3);
    let y1j = fp2_mul(y1, j);
    let y1j2 = fp2_double(y1j);
    let y3 = fp2_sub(r_vmx3, y1j2);

    let z1_plus_h = fp2_add(z1, h);
    let z1_plus_h_sq = fp2_sqr(z1_plus_h);
    let temp_z = fp2_sub(z1_plus_h_sq, z1z1);
    let z3 = fp2_sub(temp_z, hh);

    var result: G2Jacobian;
    result.x = x3;
    result.y = y3;
    result.z = z3;
    return result;
}
`;

function buildTableShaderSource(commonCode) {
    return `${commonCode}
${G2_ARITHMETIC}
@group(0) @binding(0) var<storage, read> base_point: array<u32>;
@group(0) @binding(1) var<storage, read_write> table_out: array<u32>;

fn g2_read_affine_from(offset: u32) -> G2Affine {
    var pt: G2Affine;
    for (var i = 0u; i < NUM_LIMBS; i = i + 1u) {
        pt.x.c0.limbs[i] = base_point[offset + 0u * NUM_LIMBS + i];
        pt.x.c1.limbs[i] = base_point[offset + 1u * NUM_LIMBS + i];
        pt.y.c0.limbs[i] = base_point[offset + 2u * NUM_LIMBS + i];
        pt.y.c1.limbs[i] = base_point[offset + 3u * NUM_LIMBS + i];
    }
    return pt;
}

fn g2_write_affine(offset: u32, pt: G2Affine) {
    for (var i = 0u; i < NUM_LIMBS; i = i + 1u) {
        table_out[offset + 0u * NUM_LIMBS + i] = pt.x.c0.limbs[i];
        table_out[offset + 1u * NUM_LIMBS + i] = pt.x.c1.limbs[i];
        table_out[offset + 2u * NUM_LIMBS + i] = pt.y.c0.limbs[i];
        table_out[offset + 3u * NUM_LIMBS + i] = pt.y.c1.limbs[i];
    }
}

fn g2j_to_affine(pt: G2Jacobian) -> G2Affine {
    var out: G2Affine;
    if (g2j_is_zero(pt)) {
        out.x = fp2_one();
        out.y = fp2_one();
        return out;
    }
    let z_inv = fp2_inv(pt.z);
    let z2_inv = fp2_mul(z_inv, z_inv);
    let z3_inv = fp2_mul(z2_inv, z_inv);
    out.x = fp2_mul(pt.x, z2_inv);
    out.y = fp2_mul(pt.y, z3_inv);
    return out;
}

@compute @workgroup_size(1, 1, 1)
fn build_g2_table(@builtin(global_invocation_id) gid: vec3<u32>) {
    if (gid.x > 0u || gid.y > 0u || gid.z > 0u) {
        return;
    }

    let base_aff = g2_read_affine_from(0u);
    var power = g2j_from_affine(base_aff);

    for (var w = 0u; w < 51u; w = w + 1u) {
        let power_aff = g2j_to_affine(power);
        var multiple = g2j_from_affine(power_aff);

        for (var j = 0u; j < 31u; j = j + 1u) {
            let aff = g2j_to_affine(multiple);
            let offset = (w * 31u + j) * 32u;
            g2_write_affine(offset, aff);
            multiple = g2j_madd(multiple, power_aff);
        }

        for (var d = 0u; d < 5u; d = d + 1u) {
            power = g2j_dbl(power);
        }
    }
}
`;
}

function buildNaiveShaderSource(commonCode) {
    return `${commonCode}
${G2_ARITHMETIC}
@group(0) @binding(0) var<storage, read> ref_base: array<u32>;
@group(0) @binding(1) var<storage, read> ref_scalars: array<u32>;
@group(0) @binding(2) var<storage, read> ref_params: array<u32>;
@group(0) @binding(3) var<storage, read_write> ref_results: array<u32>;

fn g2_read_affine_from(offset: u32) -> G2Affine {
    var pt: G2Affine;
    for (var i = 0u; i < NUM_LIMBS; i = i + 1u) {
        pt.x.c0.limbs[i] = ref_base[offset + 0u * NUM_LIMBS + i];
        pt.x.c1.limbs[i] = ref_base[offset + 1u * NUM_LIMBS + i];
        pt.y.c0.limbs[i] = ref_base[offset + 2u * NUM_LIMBS + i];
        pt.y.c1.limbs[i] = ref_base[offset + 3u * NUM_LIMBS + i];
    }
    return pt;
}

fn g2_read_scalar_from(offset: u32) -> BigInt {
    var s: BigInt;
    for (var i = 0u; i < NUM_LIMBS; i = i + 1u) {
        s.limbs[i] = ref_scalars[offset + i];
    }
    return s;
}

fn g2_write_jacobian_to(offset: u32, pt: G2Jacobian) {
    for (var i = 0u; i < NUM_LIMBS; i = i + 1u) {
        ref_results[offset + 0u * NUM_LIMBS + i] = pt.x.c0.limbs[i];
        ref_results[offset + 1u * NUM_LIMBS + i] = pt.x.c1.limbs[i];
        ref_results[offset + 2u * NUM_LIMBS + i] = pt.y.c0.limbs[i];
        ref_results[offset + 3u * NUM_LIMBS + i] = pt.y.c1.limbs[i];
        ref_results[offset + 4u * NUM_LIMBS + i] = pt.z.c0.limbs[i];
        ref_results[offset + 5u * NUM_LIMBS + i] = pt.z.c1.limbs[i];
    }
}

fn scalar_bit(s: BigInt, bit: u32) -> u32 {
    let limb_idx = bit / 32u;
    let bit_pos = bit % 32u;
    return (s.limbs[limb_idx] >> bit_pos) & 1u;
}

@compute @workgroup_size(64, 1, 1)
fn naive_g2_scalar_mul(@builtin(global_invocation_id) gid: vec3<u32>) {
    let tid = gid.x;
    if (tid >= ref_params[0]) {
        return;
    }

    let base_aff = g2_read_affine_from(0u);
    let scalar = g2_read_scalar_from(tid * 8u);

    var acc = g2j_zero();

    for (var bit: i32 = 254; bit >= 0; bit = bit - 1) {
        acc = g2j_dbl(acc);
        if (scalar_bit(scalar, u32(bit)) == 1u) {
            acc = g2j_madd(acc, base_aff);
        }
    }

    g2_write_jacobian_to(tid * 48u, acc);
}
`;
}

function buildComparatorShaderSource(commonCode) {
    return `${commonCode}
${G2_ARITHMETIC}
@group(0) @binding(0) var<storage, read> lhs: array<u32>;
@group(0) @binding(1) var<storage, read> rhs: array<u32>;
@group(0) @binding(2) var<storage, read_write> g2_out_flags: array<u32>;

fn fp2_eq(a: Fp2, b: Fp2) -> bool {
    return bigint_eq(a.c0, b.c0) && bigint_eq(a.c1, b.c1);
}

fn read_g2_jac_lhs(offset: u32) -> G2Jacobian {
    var pt: G2Jacobian;
    for (var i = 0u; i < NUM_LIMBS; i = i + 1u) {
        pt.x.c0.limbs[i] = lhs[offset + 0u * NUM_LIMBS + i];
        pt.x.c1.limbs[i] = lhs[offset + 1u * NUM_LIMBS + i];
        pt.y.c0.limbs[i] = lhs[offset + 2u * NUM_LIMBS + i];
        pt.y.c1.limbs[i] = lhs[offset + 3u * NUM_LIMBS + i];
        pt.z.c0.limbs[i] = lhs[offset + 4u * NUM_LIMBS + i];
        pt.z.c1.limbs[i] = lhs[offset + 5u * NUM_LIMBS + i];
    }
    return pt;
}

fn read_g2_jac_rhs(offset: u32) -> G2Jacobian {
    var pt: G2Jacobian;
    for (var i = 0u; i < NUM_LIMBS; i = i + 1u) {
        pt.x.c0.limbs[i] = rhs[offset + 0u * NUM_LIMBS + i];
        pt.x.c1.limbs[i] = rhs[offset + 1u * NUM_LIMBS + i];
        pt.y.c0.limbs[i] = rhs[offset + 2u * NUM_LIMBS + i];
        pt.y.c1.limbs[i] = rhs[offset + 3u * NUM_LIMBS + i];
        pt.z.c0.limbs[i] = rhs[offset + 4u * NUM_LIMBS + i];
        pt.z.c1.limbs[i] = rhs[offset + 5u * NUM_LIMBS + i];
    }
    return pt;
}

@compute @workgroup_size(64, 1, 1)
fn compare_g2_results(@builtin(global_invocation_id) gid: vec3<u32>) {
    let idx = gid.x;
    if (idx >= arrayLength(&g2_out_flags)) {
        return;
    }

    let a = read_g2_jac_lhs(idx * 48u);
    let b = read_g2_jac_rhs(idx * 48u);

    if (g2j_is_zero(a) && g2j_is_zero(b)) {
        g2_out_flags[idx] = 1u;
        return;
    }
    if (g2j_is_zero(a) != g2j_is_zero(b)) {
        g2_out_flags[idx] = 0u;
        return;
    }

    let z1z1 = fp2_sqr(a.z);
    let z2z2 = fp2_sqr(b.z);
    let x1n = fp2_mul(a.x, z2z2);
    let x2n = fp2_mul(b.x, z1z1);
    if (!fp2_eq(x1n, x2n)) {
        g2_out_flags[idx] = 0u;
        return;
    }

    let z1z3 = fp2_mul(z1z1, a.z);
    let z2z3 = fp2_mul(z2z2, b.z);
    let y1n = fp2_mul(a.y, z2z3);
    let y2n = fp2_mul(b.y, z1z3);
    g2_out_flags[idx] = select(0u, 1u, fp2_eq(y1n, y2n));
}
`;
}

async function createTableBuilder(device, commonCode) {
    const source = buildTableShaderSource(commonCode);
    const module = await assertShaderCompiles(device, source, "g2-table-builder");
    const bgl = device.createBindGroupLayout({
        entries: [
            { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
            { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
        ],
    });
    const pipeline = device.createComputePipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
        compute: { module, entryPoint: "build_g2_table" },
    });
    return { bgl, pipeline };
}

function createBuffer(device, size, usage, label) {
    return device.createBuffer({ size: Math.max(size, 4), usage, label });
}

async function readBufferU32(device, srcBuffer, byteLength) {
    const staging = createBuffer(device, byteLength, GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ, "staging");
    const enc = device.createCommandEncoder();
    enc.copyBufferToBuffer(srcBuffer, 0, staging, 0, byteLength);
    device.queue.submit([enc.finish()]);
    await staging.mapAsync(GPUMapMode.READ);
    const out = new Uint32Array(staging.getMappedRange().slice(0));
    staging.unmap();
    staging.destroy();
    return out;
}

async function buildFixedBaseTable(device, tableBuilder, basePointLimbs) {
    const baseBuf = createBuffer(device, basePointLimbs.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "g2-base");
    const tableByteLength = G2_TABLE_WORDS * 4;
    const tableBuf = createBuffer(device, tableByteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC, "g2-table");

    device.queue.writeBuffer(baseBuf, 0, basePointLimbs);

    const bg = device.createBindGroup({
        layout: tableBuilder.bgl,
        entries: [
            { binding: 0, resource: { buffer: baseBuf } },
            { binding: 1, resource: { buffer: tableBuf } },
        ],
    });

    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(tableBuilder.pipeline);
    pass.setBindGroup(0, bg);
    pass.dispatchWorkgroups(1, 1, 1);
    pass.end();
    device.queue.submit([enc.finish()]);

    const table = await readBufferU32(device, tableBuf, tableByteLength);
    baseBuf.destroy();
    tableBuf.destroy();
    return table;
}

async function runNaiveG2ScalarMul(device, naive, basePointLimbs, scalarLimbs, numScalars) {
    const baseBuf = createBuffer(device, basePointLimbs.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "naive-base");
    const scalarBuf = createBuffer(device, scalarLimbs.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "naive-scalars");
    const params = new Uint32Array([numScalars]);
    const paramsBuf = createBuffer(device, params.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "naive-params");
    const resultByteLength = numScalars * G2_JACOBIAN_WORDS * 4;
    const resultsBuf = createBuffer(device, resultByteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC, "naive-results");

    device.queue.writeBuffer(baseBuf, 0, basePointLimbs);
    device.queue.writeBuffer(scalarBuf, 0, scalarLimbs);
    device.queue.writeBuffer(paramsBuf, 0, params);

    const bg = device.createBindGroup({
        layout: naive.bgl,
        entries: [
            { binding: 0, resource: { buffer: baseBuf } },
            { binding: 1, resource: { buffer: scalarBuf } },
            { binding: 2, resource: { buffer: paramsBuf } },
            { binding: 3, resource: { buffer: resultsBuf } },
        ],
    });

    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(naive.pipeline);
    pass.setBindGroup(0, bg);
    pass.dispatchWorkgroups(Math.ceil(numScalars / 64), 1, 1);
    pass.end();
    device.queue.submit([enc.finish()]);

    const results = await readBufferU32(device, resultsBuf, resultByteLength);
    baseBuf.destroy();
    scalarBuf.destroy();
    paramsBuf.destroy();
    resultsBuf.destroy();
    return results;
}

async function compareProjective(device, comparator, lhs, rhs, numScalars) {
    const byteLength = numScalars * G2_JACOBIAN_WORDS * 4;
    const lhsBuf = createBuffer(device, byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "cmp-lhs");
    const rhsBuf = createBuffer(device, byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "cmp-rhs");
    const flagsBuf = createBuffer(device, numScalars * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC, "cmp-flags");

    device.queue.writeBuffer(lhsBuf, 0, lhs);
    device.queue.writeBuffer(rhsBuf, 0, rhs);

    const bg = device.createBindGroup({
        layout: comparator.bgl,
        entries: [
            { binding: 0, resource: { buffer: lhsBuf } },
            { binding: 1, resource: { buffer: rhsBuf } },
            { binding: 2, resource: { buffer: flagsBuf } },
        ],
    });

    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(comparator.pipeline);
    pass.setBindGroup(0, bg);
    pass.dispatchWorkgroups(Math.ceil(numScalars / 64), 1, 1);
    pass.end();
    device.queue.submit([enc.finish()]);

    const flags = await readBufferU32(device, flagsBuf, numScalars * 4);
    lhsBuf.destroy();
    rhsBuf.destroy();
    flagsBuf.destroy();
    return flags;
}

async function run() {
    if (!navigator.gpu) {
        setStatus("WebGPU unavailable in this browser.", "fail");
        return;
    }

    try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
            setStatus("No WebGPU adapter found.", "fail");
            return;
        }

        const device = await adapter.requestDevice();
        const shaders = await fetchShaders();
        await assertShaderCompiles(device, `${shaders.common}\n${shaders.g2Kernel}`, "g2_fixed_base_mul.wgsl");

        const g2Ready = await initGpuG2(device);
        if (!g2Ready) {
            setStatus("Failed to initialize gpu-g2.js.", "fail");
            return;
        }

        const tableBuilder = await createTableBuilder(device, shaders.common);
        const naive = await createNaiveRunner(device, shaders.common);
        const comparator = await createComparator(device, shaders.common);

        setStatus("Building G2 fixed-base table on GPU...", "warn");
        const tableStart = performance.now();
        const tableLimbs = await buildFixedBaseTable(device, tableBuilder, G2_GENERATOR_MONT);
        const tableEnd = performance.now();
        const tableBuildMs = tableEnd - tableStart;

        if (tableLimbs.length !== G2_TABLE_WORDS) {
            throw new Error(`Unexpected table size: got ${tableLimbs.length}, expected ${G2_TABLE_WORDS}`);
        }

        const tests = buildTests();
        const totalTests = tests.length + 1; // +1 for table entry 0 check
        let passCount = 0;

        // Verify table entry 0 matches the generator (from arkworks)
        {
            const EXPECTED_TABLE_ENTRY_0 = new Uint32Array([
                45883430, 2390996433, 1232798066, 3706394933, 2541820639, 4223149639, 2945863739, 425146433,
                2823577920, 2947838845, 1476581572, 1615060314, 1386229638, 166285564, 988445547, 352252035,
                2288773622, 1637743261, 4120812408, 4269789847, 589004286, 4288551522, 2929607174, 687701739,
                3340261102, 1678334806, 847068347, 3696752930, 859115638, 1442395582, 2482857090, 228892902,
            ]);
            let tableEntry0Match = true;
            for (let i = 0; i < G2_AFFINE_WORDS; i++) {
                if (tableLimbs[i] !== EXPECTED_TABLE_ENTRY_0[i]) {
                    tableEntry0Match = false;
                    break;
                }
            }
            appendResultRow({
                testName: "table entry 0 = generator (arkworks ref)",
                numScalars: "-",
                passedNaive: tableEntry0Match,
                passedJolt: tableEntry0Match,
                timing: `table ${tableBuildMs.toFixed(1)}ms`,
                mismatchDetail: tableEntry0Match ? "" : `GPU table[0]: ${formatU32Limbs(tableLimbs, 0, G2_AFFINE_WORDS)}\nExpected:     ${formatU32Limbs(EXPECTED_TABLE_ENTRY_0, 0, G2_AFFINE_WORDS)}`,
            });
            if (tableEntry0Match) passCount += 1;
        }

        for (const test of tests) {
            setStatus(`Running: ${test.name}...`, "warn");

            const t0 = performance.now();
            const fixedBaseResult = await gpuG2FixedBaseScalarMul(tableLimbs, test.scalars, test.numScalars);
            const t1 = performance.now();

            const naiveResult = await runNaiveG2ScalarMul(
                device,
                naive,
                G2_GENERATOR_MONT,
                test.scalars,
                test.numScalars,
            );
            const t2 = performance.now();

            // Compare fixed-base vs naive GPU
            const naiveFlags = await compareProjective(device, comparator, fixedBaseResult, naiveResult, test.numScalars);
            const t3 = performance.now();

            const naiveBad = [];
            for (let i = 0; i < naiveFlags.length; i += 1) {
                if (naiveFlags[i] !== 1) naiveBad.push(i);
            }
            const passedNaive = naiveBad.length === 0;

            // Compare fixed-base vs Jolt reference (arkworks)
            const joltRefs = JOLT_REF[test.name];
            let passedJolt = false;
            let joltDetail = "";
            if (joltRefs) {
                const joltJacobians = buildJoltRefJacobians(joltRefs);
                const joltFlags = await compareProjective(device, comparator, fixedBaseResult, joltJacobians, test.numScalars);
                const joltBad = [];
                for (let i = 0; i < joltFlags.length; i += 1) {
                    if (joltFlags[i] !== 1) joltBad.push(i);
                }
                passedJolt = joltBad.length === 0;
                if (!passedJolt) {
                    const subset = joltBad.slice(0, 3);
                    joltDetail = subset.map((idx) => {
                        return [
                            `Scalar index ${idx}`,
                            `GPU result:\n${formatG2Point(fixedBaseResult, idx)}`,
                            `Jolt (arkworks):\n${formatG2Point(joltJacobians, idx)}`,
                        ].join("\n");
                    }).join("\n\n");
                }
            } else {
                joltDetail = "No Jolt reference for this test";
            }
            const t4 = performance.now();

            if (passedNaive && passedJolt) passCount += 1;

            let mismatchDetail = "";
            if (!passedNaive) {
                const subset = naiveBad.slice(0, 3);
                mismatchDetail += "[vs Naive GPU]\n" + subset.map((idx) => {
                    return [
                        `Scalar index ${idx}`,
                        `Fixed-base:\n${formatG2Point(fixedBaseResult, idx)}`,
                        `Naive:\n${formatG2Point(naiveResult, idx)}`,
                    ].join("\n");
                }).join("\n\n");
            }
            if (!passedJolt && joltDetail) {
                if (mismatchDetail) mismatchDetail += "\n\n";
                mismatchDetail += "[vs Jolt arkworks]\n" + joltDetail;
            }

            appendResultRow({
                testName: test.name,
                numScalars: test.numScalars,
                passedNaive,
                passedJolt,
                timing: `table ${tableBuildMs.toFixed(1)}ms, fixed ${(t1 - t0).toFixed(1)}ms, naive ${(t2 - t1).toFixed(1)}ms, jolt-cmp ${(t4 - t3).toFixed(1)}ms`,
                mismatchDetail,
            });
        }

        // ---------------------------------------------------------------
        // Caching benchmark: upload table once, then multiple scalar muls
        // ---------------------------------------------------------------
        {
            const benchScalars = randomScalarBatch(16, 0xDEADBEEF);
            const tableLimbsArr = new Uint32Array(tableLimbs);

            // Non-cached path: full table + scalar mul each time
            const ncTimes = [];
            for (let i = 0; i < 3; i++) {
                const t0 = performance.now();
                await gpuG2FixedBaseScalarMul(tableLimbsArr, benchScalars, 16);
                ncTimes.push(performance.now() - t0);
            }
            const ncAvg = ncTimes.reduce((a, b) => a + b, 0) / ncTimes.length;

            // Cached path: upload once, then scalar muls only
            const uploadT0 = performance.now();
            gpuG2UploadTable(tableLimbsArr);
            const uploadTime = performance.now() - uploadT0;

            const cTimes = [];
            for (let i = 0; i < 3; i++) {
                const t0 = performance.now();
                await gpuG2ScalarMulCached(benchScalars, 16);
                cTimes.push(performance.now() - t0);
            }
            const cAvg = cTimes.reduce((a, b) => a + b, 0) / cTimes.length;

            // Verify correctness: cached result should match non-cached
            const refResult = await gpuG2FixedBaseScalarMul(tableLimbsArr, benchScalars, 16);
            const cachedResult = await gpuG2ScalarMulCached(benchScalars, 16);
            const cmpFlags = await compareProjective(device, comparator, refResult, cachedResult, 16);
            const allMatch = Array.from(cmpFlags).every(f => f === 1);

            appendResultRow({
                testName: `cache benchmark (16 scalars)`,
                numScalars: 16,
                passedNaive: allMatch,
                passedJolt: allMatch,
                timing: `upload: ${uploadTime.toFixed(1)}ms, cached: ${cAvg.toFixed(1)}ms, non-cached: ${ncAvg.toFixed(1)}ms`,
                mismatchDetail: allMatch ? '' : 'Cached result does not match non-cached result',
            });
            if (allMatch) passCount += 1;
            // Adjust total
        }

        setStatus(
            `Done: ${passCount}/${totalTests + 1} tests passed.`,
            passCount === totalTests + 1 ? "pass" : "fail",
        );
    } catch (err) {
        console.error(err);
        setStatus(`Error: ${err instanceof Error ? err.message : String(err)}`, "fail");
    }
}

run();
</script>
