<script type="module">
import { initGPUMSM, executeGPUBatchMSM, executeGPUBatchMSMChunked, executeGPUBatchMSMHybrid, executeGPUBatchMSMChunkedHybrid } from "./gpu-msm.js";

// ── WASM (CPU MSM) — optional, loaded dynamically ──
let wasmCpuMsm = null;
async function loadWasm() {
    try {
        const wasm = await import("/pkg/jolt_wasm_sha2_prover.js");
        await wasm.default();
        const numThreads = navigator.hardwareConcurrency || 4;
        await wasm.initThreadPool(numThreads);
        wasmCpuMsm = wasm.cpu_batch_msm;
        return numThreads;
    } catch (e) {
        console.warn("WASM load failed (CPU MSM unavailable):", e);
        return 0;
    }
}

const NUM_LIMBS = 8;
const PT_STRIDE = 16;
const JAC_STRIDE = 24; // 3 * NUM_LIMBS

// ── Arkworks reference constants (Montgomery form u32 limbs, little-endian) ──
const REF_G_X = new Uint32Array([3314486685, 3546104717, 4123462461, 175696680, 2021213740, 1718526831, 2584207151, 235567041]);

    common: "./shaders/bn254_common.wgsl",

const resultsBody = document.getElementById("results-body");

function hex32(x) {
    return `0x${(x >>> 0).toString(16).padStart(8, "0")}`;
}

function formatLimbs(data, offset) {
    const words = [];
    for (let i = 0; i < NUM_LIMBS; i += 1) {
        words.push(hex32(data[offset + i]));
    }
    return `[${words.join(", ")}]`;
}

function formatPoint(data, msmIdx) {
    const base = msmIdx * JAC_STRIDE;
    return `x=${formatLimbs(data, base)}\ny=${formatLimbs(data, base + 8)}\nz=${formatLimbs(data, base + 16)}`;
}

// ── Helpers ────────────────────────────────────────────────────────────────

function createBuffer(device, size, usage, label) {
    return device.createBuffer({ size: Math.max(size, 4), usage, label });
}

async function readBufferU32(device, srcBuffer, byteLength) {
    const staging = createBuffer(device, byteLength, GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ, "staging");
    const enc = device.createCommandEncoder();
    enc.copyBufferToBuffer(srcBuffer, 0, staging, 0, byteLength);
    device.queue.submit([enc.finish()]);
    await staging.mapAsync(GPUMapMode.READ);
    const out = new Uint32Array(staging.getMappedRange().slice(0));
    staging.unmap();
    staging.destroy();
    return out;
}

function assertShaderCompiles(device, code, label) {
    const module = device.createShaderModule({ code });
    return module.getCompilationInfo().then((info) => {
        const errors = info.messages.filter((m) => m.type === "error");
        if (errors.length > 0) {
            const reason = errors.map((e) => `${e.message} (line ${e.lineNum})`).join("; ");
            throw new Error(`Shader compile failed [${label}]: ${reason}`);
        }
        return module;
    });
}

async function fetchShaders() {
    const entries = await Promise.all(Object.entries(SHADER_PATHS).map(async ([name, path]) => {
        const resp = await fetch(path);
        if (!resp.ok) throw new Error(`Failed to fetch ${path}: HTTP ${resp.status}`);
        return [name, await resp.text()];
    }));
    return Object.fromEntries(entries);
}

function mulberry32(seed) {
    let t = seed >>> 0;
    return () => {
        t = (t + 0x6d2b79f5) >>> 0;
        let x = Math.imul(t ^ (t >>> 15), t | 1);
        x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
        return ((x ^ (x >>> 14)) >>> 0);
    };
}

function scalarFromU32(value) {
    const out = new Uint32Array(NUM_LIMBS);
    out[0] = value >>> 0;
    return out;
}

function maskScalarToBitWidth(limbs, bitWidth) {
    const out = new Uint32Array(limbs);
    if (bitWidth >= 256) return out;
    const fullLimbs = Math.floor(bitWidth / 32);
    const rem = bitWidth % 32;
    for (let i = fullLimbs + (rem > 0 ? 1 : 0); i < NUM_LIMBS; i += 1) out[i] = 0;
    if (rem > 0) out[fullLimbs] &= ((1 << rem) - 1) >>> 0;
    return out;
}

function makeScalarMatrix(numPoints, batchSize, bitWidth, generator) {
    const total = numPoints * batchSize;
    const out = new Uint32Array(total * NUM_LIMBS);
    for (let idx = 0; idx < total; idx += 1) {
        const limbs = maskScalarToBitWidth(generator(idx), bitWidth);
        out.set(limbs, idx * NUM_LIMBS);
    }
    return out;
}

// ── GPU point generator (G, 2G, 3G, ...) ──────────────────────────────────

async function createPointGenerator(device, sharedCode) {
    const pointGenSource = `${sharedCode}
@group(0) @binding(0) var<storage, read> params: array<u32>;
@group(0) @binding(1) var<storage, read_write> points_raw: array<u32>;

fn generator_jacobian() -> G1Jacobian {
    var g: G1Jacobian;
    for (var i = 0u; i < NUM_LIMBS; i = i + 1u) {
        g.x.limbs[i] = BN254_ONE_ZR[i];
        g.y.limbs[i] = BN254_ONE_YR[i];
    }
    g.z = g1_one_mont_z();
    return g;
}

fn jacobian_to_affine(pt: G1Jacobian) -> G1Affine {
    var out: G1Affine;
    if (is_g1_zero(pt)) {
        out.x = g1_one_mont_z();
        out.y = g1_one_mont_z();
        return out;
    }
    let z_inv = ff_invert(pt.z);
    let z2_inv = mont_mul_cios(z_inv, z_inv);
    let z3_inv = mont_mul_cios(z2_inv, z_inv);
    out.x = mont_mul_cios(pt.x, z2_inv);
    out.y = mont_mul_cios(pt.y, z3_inv);
    return out;
}

@compute @workgroup_size(1, 1, 1)
fn generate_points(@builtin(global_invocation_id) gid: vec3<u32>) {
    if (gid.x > 0u) { return; }
    let num_points = params[0];
    var g = generator_jacobian();
    var cur = g;
    for (var idx = 0u; idx < num_points; idx = idx + 1u) {
        let aff = jacobian_to_affine(cur);
        let out_base = idx * 16u;
        for (var i = 0u; i < NUM_LIMBS; i = i + 1u) {
            points_raw[out_base + i] = aff.x.limbs[i];
            points_raw[out_base + 8u + i] = aff.y.limbs[i];
        }
        cur = g1_add(cur, g);
    }
}
`;
    const module = await assertShaderCompiles(device, pointGenSource, "point-generator");
    const bgl = device.createBindGroupLayout({
        entries: [
            { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
            { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
        ],
    });
    const pipeline = device.createComputePipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
        compute: { module, entryPoint: "generate_points" },
    });
    return { bgl, pipeline };
}

async function generatePoints(device, pointGen, numPoints) {
    const params = new Uint32Array([numPoints]);
    const paramsBuf = createBuffer(device, params.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "point-params");
    const pointsBuf = createBuffer(device, numPoints * PT_STRIDE * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC, "points");
    device.queue.writeBuffer(paramsBuf, 0, params);

    const bg = device.createBindGroup({
        layout: pointGen.bgl,
        entries: [
            { binding: 0, resource: { buffer: paramsBuf } },
            { binding: 1, resource: { buffer: pointsBuf } },
        ],
    });

    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(pointGen.pipeline);
    pass.setBindGroup(0, bg);
    pass.dispatchWorkgroups(1, 1, 1);
    pass.end();
    device.queue.submit([enc.finish()]);

    const points = await readBufferU32(device, pointsBuf, numPoints * PT_STRIDE * 4);
    paramsBuf.destroy();
    pointsBuf.destroy();
    return points;
}

// ── Naive GPU MSM reference ────────────────────────────────────────────────

async function createNaiveRunner(device, sharedCode, naiveCode) {
    const module = await assertShaderCompiles(device, `${sharedCode}\n${naiveCode}`, "naive-msm");
    const bgl = device.createBindGroupLayout({
        entries: [
            { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
            { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
            { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
            { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
        ],
    });
    const pipeline = device.createComputePipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
        compute: { module, entryPoint: "naive_msm" },
    });
    return { bgl, pipeline };
}

async function runNaiveMSM(device, naive, pointsFlat, scalarsFlat, numPoints, batchSize, scalarBitWidth) {
    const pointsBuf = createBuffer(device, pointsFlat.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "naive-points");
    const scalarsBuf = createBuffer(device, scalarsFlat.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "naive-scalars");
    const params = new Uint32Array([numPoints, batchSize, scalarBitWidth]);
    const paramsBuf = createBuffer(device, params.byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "naive-params");
    const resultByteLength = batchSize * JAC_STRIDE * 4;
    const resultsBuf = createBuffer(device, resultByteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC, "naive-results");

    device.queue.writeBuffer(pointsBuf, 0, pointsFlat);
    device.queue.writeBuffer(scalarsBuf, 0, scalarsFlat);
    device.queue.writeBuffer(paramsBuf, 0, params);

    const bg = device.createBindGroup({
        layout: naive.bgl,
        entries: [
            { binding: 0, resource: { buffer: pointsBuf } },
            { binding: 1, resource: { buffer: scalarsBuf } },
            { binding: 2, resource: { buffer: paramsBuf } },
            { binding: 3, resource: { buffer: resultsBuf } },
        ],
    });

    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(naive.pipeline);
    pass.setBindGroup(0, bg);
    pass.dispatchWorkgroups(Math.ceil(batchSize / 64), 1, 1);
    pass.end();
    device.queue.submit([enc.finish()]);

    const result = await readBufferU32(device, resultsBuf, resultByteLength);
    pointsBuf.destroy();
    scalarsBuf.destroy();
    paramsBuf.destroy();
    resultsBuf.destroy();
    return result;
}

// ── Jacobian-vs-Jacobian projective comparator ─────────────────────────────

async function createComparator(device, sharedCode) {
    const compareSource = `${sharedCode}
@group(0) @binding(0) var<storage, read> lhs: array<BigInt>;
@group(0) @binding(1) var<storage, read> rhs: array<BigInt>;
@group(0) @binding(2) var<storage, read_write> out_flags: array<u32>;

@compute @workgroup_size(64, 1, 1)
fn compare_results(@builtin(global_invocation_id) gid: vec3<u32>) {
    let idx = gid.x;
    if (idx >= arrayLength(&out_flags)) { return; }

    let base = 3u * idx;
    var a: G1Jacobian;
    a.x = lhs[base];
    a.y = lhs[base + 1u];
    a.z = lhs[base + 2u];

    var b: G1Jacobian;
    b.x = rhs[base];
    b.y = rhs[base + 1u];
    b.z = rhs[base + 2u];

    if (is_g1_zero(a) && is_g1_zero(b)) {
        out_flags[idx] = 1u;
        return;
    }
    if (is_g1_zero(a) != is_g1_zero(b)) {
        out_flags[idx] = 0u;
        return;
    }

    let z1z1 = mont_mul_cios(a.z, a.z);
    let z2z2 = mont_mul_cios(b.z, b.z);
    let x1n = mont_mul_cios(a.x, z2z2);
    let x2n = mont_mul_cios(b.x, z1z1);
    if (!bigint_eq(x1n, x2n)) {
        out_flags[idx] = 0u;
        return;
    }

    let z1z3 = mont_mul_cios(z1z1, a.z);
    let z2z3 = mont_mul_cios(z2z2, b.z);
    let y1n = mont_mul_cios(a.y, z2z3);
    let y2n = mont_mul_cios(b.y, z1z3);
    out_flags[idx] = select(0u, 1u, bigint_eq(y1n, y2n));
}
`;
    const module = await assertShaderCompiles(device, compareSource, "result-compare");
    const bgl = device.createBindGroupLayout({
        entries: [
            { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
            { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
            { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
        ],
    });
    const pipeline = device.createComputePipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
        compute: { module, entryPoint: "compare_results" },
    });
    return { bgl, pipeline };
}

async function compareProjective(device, comparator, lhs, rhs, batchSize) {
    const byteLength = batchSize * JAC_STRIDE * 4;
    const lhsBuf = createBuffer(device, byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "cmp-lhs");
    const rhsBuf = createBuffer(device, byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "cmp-rhs");
    const flagsBuf = createBuffer(device, batchSize * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC, "cmp-flags");

    device.queue.writeBuffer(lhsBuf, 0, lhs);
    device.queue.writeBuffer(rhsBuf, 0, rhs);

    const bg = device.createBindGroup({
        layout: comparator.bgl,
        entries: [
            { binding: 0, resource: { buffer: lhsBuf } },
            { binding: 1, resource: { buffer: rhsBuf } },
            { binding: 2, resource: { buffer: flagsBuf } },
        ],
    });

    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(comparator.pipeline);
    pass.setBindGroup(0, bg);
    pass.dispatchWorkgroups(Math.ceil(batchSize / 64), 1, 1);
    pass.end();
    device.queue.submit([enc.finish()]);

    const flags = await readBufferU32(device, flagsBuf, batchSize * 4);
    lhsBuf.destroy();
    rhsBuf.destroy();
    flagsBuf.destroy();
    return flags;
}

// ── Jacobian-vs-Affine comparator (for arkworks reference comparison) ──────

async function createAffineComparator(device, sharedCode) {
    const src = `${sharedCode}
@group(0) @binding(0) var<storage, read> jac_data: array<BigInt>;
@group(0) @binding(1) var<storage, read> aff_data: array<BigInt>;
@group(0) @binding(2) var<storage, read_write> out_flags: array<u32>;

@compute @workgroup_size(64, 1, 1)
fn compare_jac_affine(@builtin(global_invocation_id) gid: vec3<u32>) {
    let idx = gid.x;
    if (idx >= arrayLength(&out_flags)) { return; }

    let jac_base = 3u * idx;
    var a: G1Jacobian;
    a.x = jac_data[jac_base];
    a.y = jac_data[jac_base + 1u];
    a.z = jac_data[jac_base + 2u];

    let aff_base = 2u * idx;
    let ref_x = aff_data[aff_base];
    let ref_y = aff_data[aff_base + 1u];

    if (is_g1_zero(a)) {
        out_flags[idx] = select(1u, 0u, !is_bigint_zero(ref_x) || !is_bigint_zero(ref_y));
        return;
    }

    let z2 = mont_mul_cios(a.z, a.z);
    let z3 = mont_mul_cios(z2, a.z);
    let x_check = mont_mul_cios(ref_x, z2);
    let y_check = mont_mul_cios(ref_y, z3);
    out_flags[idx] = select(0u, 1u, bigint_eq(a.x, x_check) && bigint_eq(a.y, y_check));
}
`;
    const module = await assertShaderCompiles(device, src, "jac-affine-compare");
    const bgl = device.createBindGroupLayout({
        entries: [
            { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
            { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
            { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
        ],
    });
    const pipeline = device.createComputePipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
        compute: { module, entryPoint: "compare_jac_affine" },
    });
    return { bgl, pipeline };
}

async function compareJacVsAffine(device, affComp, jacData, affinePoints, count) {
    const jacBytes = count * JAC_STRIDE * 4;
    const affBytes = count * PT_STRIDE * 4;
    const jacBuf = createBuffer(device, jacBytes, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "jac-buf");
    const affBuf = createBuffer(device, affBytes, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST, "aff-buf");
    const flagsBuf = createBuffer(device, count * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC, "flags-buf");

    device.queue.writeBuffer(jacBuf, 0, jacData);
    device.queue.writeBuffer(affBuf, 0, affinePoints);

    const bg = device.createBindGroup({
        layout: affComp.bgl,
        entries: [
            { binding: 0, resource: { buffer: jacBuf } },
            { binding: 1, resource: { buffer: affBuf } },
            { binding: 2, resource: { buffer: flagsBuf } },
        ],
    });

    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(affComp.pipeline);
    pass.setBindGroup(0, bg);
    pass.dispatchWorkgroups(Math.ceil(count / 64), 1, 1);
    pass.end();
    device.queue.submit([enc.finish()]);

    const flags = await readBufferU32(device, flagsBuf, count * 4);
    jacBuf.destroy();
    affBuf.destroy();
    flagsBuf.destroy();
    return flags;
}

// ── Build affine reference flat array from (x, y) component arrays ─────────

function buildAffineRef(...pairs) {
    const out = new Uint32Array(pairs.length * PT_STRIDE);
    for (let i = 0; i < pairs.length; i += 1) {
        out.set(pairs[i][0], i * PT_STRIDE);
        out.set(pairs[i][1], i * PT_STRIDE + NUM_LIMBS);
    }
    return out;
}

// ── Convert GPU-generated affine points to Jacobian (z=1 Mont) for comparator ──

function affineToJacobian(affFlat, numPoints) {
    // z = Montgomery 1 = R mod p. For BN254: Fq::one() in Montgomery form
    // From the point generator, g1_one_mont_z() is used. We need its limbs.
    // Actually, the MSM pipeline returns Jacobian. For the point generation test,
    // we compare GPU-generated affine points against reference affine points.
    // We need to wrap affine as Jacobian with z = R mod p.
    // BN254 Fq Montgomery R = 0x0e0a77c19a07df2f666ea36f7879462c0a78eb28f5c70b3dd35d438dc58f0d9d
    const MONT_ONE = new Uint32Array([0xc58f0d9d, 0xd35d438d, 0xf5c70b3d, 0x0a78eb28, 0x7879462c, 0x666ea36f, 0x9a07df2f, 0x0e0a77c1]);
    const out = new Uint32Array(numPoints * JAC_STRIDE);
    for (let i = 0; i < numPoints; i += 1) {
        const aBase = i * PT_STRIDE;
        const jBase = i * JAC_STRIDE;
        for (let j = 0; j < NUM_LIMBS; j += 1) {
            out[jBase + j] = affFlat[aBase + j];           // x
            out[jBase + NUM_LIMBS + j] = affFlat[aBase + NUM_LIMBS + j]; // y
            out[jBase + 2 * NUM_LIMBS + j] = MONT_ONE[j];  // z = 1 in Montgomery
        }
    }
    return out;
}

                const chResult = await executeGPUBatchMSMChunkedHybrid(pts, scalars, numPoints, bitWidth, batchSize, wasmCpuMsm);
                const t2 = performance.now();

                const flags = await compareProjective(device, comparator, origResult, chResult, batchSize);
                const bad = [];
                for (let i = 0; i < flags.length; i++) if (flags[i] !== 1) bad.push(i);
                const passed = bad.length === 0;
                if (passed) passCount += 1;

                let mismatchDetail = "";
                if (!passed) {
                    const subset = bad.slice(0, 3);
                    mismatchDetail = subset.map(idx => [
                        `MSM index ${idx}`,
                        `Original:\n${formatPoint(origResult, idx)}`,
                        `Chunked+Hybrid:\n${formatPoint(chResult, idx)}`,
                    ].join("\n")).join("\n\n");
                    if (bad.length > subset.length) mismatchDetail += `\n\n... ${bad.length - subset.length} more mismatches`;
                }

                appendResultRow({
                    testName: "Chunked+Hybrid vs original (Dory tier-1)",
                    numPoints, batchSize, scalarBitWidth: bitWidth, passed,
                    timing: `orig ${(t1-t0).toFixed(1)}ms, ch+hybrid ${(t2-t1).toFixed(1)}ms`,
                    mismatchDetail,
                });
            } else {
                appendResultRow({
                    testName: "Chunked+Hybrid vs original (Dory tier-1)",
                    numPoints: 2048, batchSize: 128, scalarBitWidth: 256, passed: false,
                    timing: "-", mismatchDetail: "SKIP: WASM module not available",
                });
            }
        }

        // ── Test o: Performance comparison (all variants) ────────────
        {
            setStatus("Running: performance comparison...", "warn");
            const numPoints = 2048, batchSize = 128, bitWidth = 256, seed = 0xBEEFCAFE;
            const pts = await getPoints(numPoints);
            const rng1 = mulberry32(seed);
            const scalars = makeScalarMatrix(numPoints, batchSize, bitWidth, () => {
                const v = new Uint32Array(NUM_LIMBS);
                for (let i = 0; i < NUM_LIMBS; i++) v[i] = rng1();
                return v;
            });

            // Warm up (first call may be slower due to pipeline caching)
            await executeGPUBatchMSM(pts, scalars, numPoints, bitWidth, batchSize);

            // Original pipeline
            const t0 = performance.now();
            await executeGPUBatchMSM(pts, scalars, numPoints, bitWidth, batchSize);
            const t1 = performance.now();

            // Chunked pipeline
            const t2 = performance.now();
            await executeGPUBatchMSMChunked(pts, scalars, numPoints, bitWidth, batchSize);
            const t3 = performance.now();

            // Hybrid (if WASM available)
            let hybridTime = '-';
            let chHybridTime = '-';
            if (wasmCpuMsm) {
                const t4 = performance.now();
                await executeGPUBatchMSMHybrid(pts, scalars, numPoints, bitWidth, batchSize, wasmCpuMsm);
                const t5 = performance.now();
                hybridTime = `${(t5-t4).toFixed(1)}ms`;

                const t6 = performance.now();
                await executeGPUBatchMSMChunkedHybrid(pts, scalars, numPoints, bitWidth, batchSize, wasmCpuMsm);
                const t7 = performance.now();
                chHybridTime = `${(t7-t6).toFixed(1)}ms`;
            }

            passCount += 1; // performance test always passes
            appendResultRow({
                testName: "Perf: all variants (Dory tier-1)",
                numPoints, batchSize, scalarBitWidth: bitWidth, passed: true,
                timing: `orig=${(t1-t0).toFixed(1)}ms chunk=${(t3-t2).toFixed(1)}ms hybrid=${hybridTime} ch+hybrid=${chHybridTime}`,
                mismatchDetail: "",
            });
        }

        setStatus(
            `Done: ${passCount}/${totalTests} tests passed.`,
            passCount === totalTests ? "pass" : "fail",
        );
    } catch (err) {
        console.error(err);
        setStatus(`Error: ${err instanceof Error ? err.message : String(err)}`, "fail");
    }
}

run();
</script>
