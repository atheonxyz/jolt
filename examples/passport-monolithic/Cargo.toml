[workspace]
members = ["jolt-guest"]


[package]
name = "passport-monolithic"
version = "0.1.0"
edition = "2021"
description = "Passport monolthic example using Jolt"

[dependencies]
rsa = { version = "0.9.8", features = ["sha2"] }
sha2 = { version = "0.10", features = ["compress"] }
x509-parser = "0.16"
base64 = "0.22"
hex = "0.4"
rasn = "0.15"
rasn-pkix = "0.15"
rasn-cms = "0.15"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.143"
toml = "0.8"
noir-bignum-paramgen = "0.1.5"
thiserror = "2.0.16"
signature = "2.2"
lazy_static = "1.5.0"
jolt-sdk = { git = "https://github.com/a16z/jolt", branch = "main", features = [
    "host",
    "zk",
] }
guest = { package = "passport-guest", path = "jolt-guest" }
tracing = "0.1"
tracing-subscriber = "0.3"
jolt-inlines-sha2 = { git = "https://github.com/a16z/jolt", branch = "main", features = [
    "host",
] }

[profile.release]
debug = 1
codegen-units = 1
lto = "fat"

[patch.crates-io]
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ec = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
jolt-optimizations = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
allocative = { git = "https://github.com/facebookexperimental/allocative", rev = "85b773d85d526d068ce94724ff7a7b81203fc95e" }
